name: 缺陷报告
description: 报告可复现的缺陷（安全问题请勿用公开 Issue）
title: "[缺陷] 简述现象"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **安全漏洞请勿在此提交**，见 `SECURITY.md`。
        请勿粘贴真实密码、连接串或生产数据。

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: 0.1.0 或 commit sha
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Linux
        - Windows
        - macOS
        - 不涉及平台（后端/契约）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 包含错误码与日志片段（请先脱敏）
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: 操作系统版本、数据库版本、安装方式
    validations:
      required: false
