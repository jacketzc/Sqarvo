name: CI

# 代码 CI。纯文档改动不再触发这三条作业 —— 注册表 / 规格文档的校验在
# ui-contract.yml 里（按路径触发）。注意 paths-ignore 只在整个 diff 都命中时才跳过。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  backend:
    name: 后端（Linux）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # protoc 由构建脚本内置，无需额外安装。
      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test

      # SQLite 覆盖单独列出：这些用例不需要任何外部服务，必须每次都真实执行，
      # 不能因为测试文件缺失或被过滤而静默跳过（v0.1 退出标准要求）。
      - name: SQLite 驱动测试（类型映射与截断）
        run: cargo test -p sqarvo-driver-sqlite --test type_mapping -- --nocapture

      - name: SQLite gRPC 端到端（UDS + 临时库）
        run: cargo test -p sqarvo-rpc-server --test grpc_sqlite_e2e -- --nocapture

  # 前端作业：proto 变更（例如 #70 给 ApplyRowChangesRequest 加字段）会直接打破
  # frontend/linux 的编译，而这类破坏只有真的编译一次前端才会暴露——本地三项检查
  # 曾长期只手工跑，于是 PR 全绿、main 变红（修复提交 67bfda0）。三项检查与
  # frontend/linux/README.md「构建与运行」一致。
  #
  # runner 用 ubuntu-26.04 而非 24.04：crate 在构建期要求 GTK ≥ 4.16（gtk4-sys 的
  # `v4_16` → system-deps version = "4.16"）与 libadwaita ≥ 1.6（`v1_6` → "1.6"），
  # 而 noble 只有 libgtk-4-dev 4.14.2 / libadwaita-1-dev 1.5.0，pkg-config 检查就
  # 过不了，换什么代码都绕不开；resolute 提供 4.22 / 1.9。下面的版本门禁把这件事写进
  # 日志：runner 镜像回退时直接失败，而不是留一句难懂的 system-deps 报错。
  frontend:
    name: 前端（Linux）
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend/linux
    steps:
      - uses: actions/checkout@v4

      # 构建依赖与 frontend/linux/README.md「依赖」一节一致。
      # protoc 由 build.rs 的 protoc-bin-vendored 提供，不需要系统安装。
      # apt 包用缓存恢复，避免每次作业重下整套 GTK 开发包（约 200 MB）。
      - name: 安装 GTK 依赖
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libadwaita-1-dev build-essential pkg-config
          version: 1.0

      - name: 校验 GTK 版本
        run: |
          set -euo pipefail
          GTK="$(pkg-config --modversion gtk4)"
          ADW="$(pkg-config --modversion libadwaita-1)"
          echo "GTK ${GTK} / libadwaita ${ADW}"
          dpkg --compare-versions "${GTK}" ge 4.16 \
            || { echo "::error::GTK ${GTK} < 4.16，gtk4 的 v4_16 feature 无法构建"; exit 1; }
          dpkg --compare-versions "${ADW}" ge 1.6 \
            || { echo "::error::libadwaita ${ADW} < 1.6，adw 的 v1_6 feature 无法构建"; exit 1; }

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/linux

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # 与 MariaDB 作业同一条原则：用例被过滤成 0 个也必须变红，
      # 不能让「cargo test 什么都没跑」冒充通过。
      - name: 测试
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          LOG=frontend-tests.log
          STATUS=0
          cargo test 2>&1 | tee "${LOG}" || STATUS=$?

          PASSED="$(grep -o 'test result: ok\. [0-9]* passed' "${LOG}" \
            | tail -n1 | grep -o '[0-9]*' || true)"
          echo "通过用例数：${PASSED:-<未解析到>}"
          if [ -z "${PASSED}" ]; then
            echo "::error::日志中缺少 'test result: ok. N passed'"
            exit 1
          fi
          if [ "${PASSED}" -le 0 ]; then
            echo "::error::通过用例数为 0，测试未真实执行"
            exit 1
          fi

          exit "${STATUS}"

  # MariaDB 集成测试单独成作业：服务容器启动失败或驱动回归不应掩盖 SQLite 覆盖，
  # 反之亦然。账号/密码/库名与 tests/integration/docker-compose.yml 完全一致
  # （测试专用值，不是真实凭据，因此不引入任何 secret）。
  mariadb-tests:
    name: MariaDB 集成测试（服务容器）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: sqarvo_test
          MARIADB_PASSWORD: sqarvo_test_only
          MARIADB_DATABASE: sqarvo_test
          MARIADB_ROOT_PASSWORD: sqarvo_root_test_only
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # 健康检查通过后端口理论上已就绪，仍显式探测一次，避免步骤卡在连接超时上。
      - name: 等待 MariaDB 端口
        run: |
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; do sleep 1; done'
          echo "127.0.0.1:3306 已可连接"

      # 跨库表数据用例（#140 / ADR 0024）需要第二个库 `<DSN 库>_b`：测试账号只有
      # sqarvo_test 的权限，因此由 root 建库并授权（测试专用值，不是真实凭据）。
      # 用镜像自带的 `mariadb` 客户端：mariadb:11.4 里没有 `mysql` 这个命令名。
      - name: 准备跨库测试库
        run: |
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -uroot -psqarvo_root_test_only -e "
              CREATE DATABASE IF NOT EXISTS sqarvo_test_b;
              GRANT ALL ON sqarvo_test_b.* TO 'sqarvo_test'@'%';
              FLUSH PRIVILEGES;"

      # 断言逻辑说明见 tests/integration/README.md「CI」小节：
      # 用例被过滤成 0 个、或整批被跳过，都必须让作业变红。
      - name: MariaDB 驱动集成测试
        env:
          SQARVO_MARIADB_URL: mysql://sqarvo_test:sqarvo_test_only@127.0.0.1:3306/sqarvo_test
          # CI 输出里 cargo 仍会带 ANSI 颜色（"Running" 与控制台转义被拆开），
          # 会让下面的日志断言误判，日志本身也不便于阅读。
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          LOG=mariadb-tests.log

          # 1. 先取「发现数」：--list 不执行用例，只列出编译期注册的测试。
          DISCOVERED="$(cargo test -p sqarvo-driver-mariadb --test integration -- --list \
            | grep -c ': test' || true)"
          echo "发现用例数：${DISCOVERED}"
          if [ "${DISCOVERED}" -eq 0 ]; then
            echo "::error::未发现任何 MariaDB 用例（测试文件缺失或被过滤）"
            exit 1
          fi

          # 2. 真实执行，保留完整日志（pipefail 保证 cargo 的失败状态不被 tee 吞掉）。
          STATUS=0
          cargo test -p sqarvo-driver-mariadb --test integration -- --nocapture 2>&1 \
            | tee "${LOG}" || STATUS=$?

          # 3. 断言用例没有被跳过（未设置变量的跳过路径）。
          if grep -q "跳过：未设置 SQARVO_MARIADB_URL" "${LOG}"; then
            echo "::error::用例进入了跳过分支，SQARVO_MARIADB_URL 未生效"
            exit 1
          fi

          # 4. 断言集成测试二进制确实被执行（而不是只跑了单元测试）。
          # 用 .* 容忍可能的 ANSI 控制序列，避免颜色码把 "Running" 与路径拆开。
          if ! grep -Eq 'Running.*tests/integration\.rs' "${LOG}"; then
            echo "::error::日志中缺少 Running tests/integration.rs，集成测试未执行"
            exit 1
          fi

          # 5. 解析实际通过数，要求 > 0 且等于发现数（不允许部分用例被静默丢弃）。
          PASSED="$(grep -o 'test result: ok\. [0-9]* passed' "${LOG}" \
            | tail -n1 | grep -o '[0-9]*' || true)"
          echo "实际通过用例数：${PASSED:-<未解析到>} / 发现 ${DISCOVERED}"
          if [ -z "${PASSED}" ]; then
            echo "::error::日志中缺少 'test result: ok. N passed'"
            exit 1
          fi
          if [ "${PASSED}" -le 0 ]; then
            echo "::error::通过用例数为 0，测试未真实执行"
            exit 1
          fi
          if [ "${PASSED}" -ne "${DISCOVERED}" ]; then
            echo "::error::通过用例数 ${PASSED} 与发现数 ${DISCOVERED} 不一致"
            exit 1
          fi

          exit "${STATUS}"

      # 跨库表数据用例单独一步：与上面的集成用例共用服务容器与账号，
      # 但断言目标是 cross_catalog.rs，不能靠集成测试的日志断言覆盖。
      - name: MariaDB 跨库表数据用例
        env:
          SQARVO_MARIADB_URL: mysql://sqarvo_test:sqarvo_test_only@127.0.0.1:3306/sqarvo_test
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          LOG=cross-catalog-tests.log

          DISCOVERED="$(cargo test -p sqarvo-driver-mariadb --test cross_catalog -- --list \
            | grep -c ': test' || true)"
          echo "发现用例数：${DISCOVERED}"
          if [ "${DISCOVERED}" -eq 0 ]; then
            echo "::error::未发现任何跨库表数据用例"
            exit 1
          fi

          STATUS=0
          cargo test -p sqarvo-driver-mariadb --test cross_catalog -- --nocapture 2>&1 \
            | tee "${LOG}" || STATUS=$?

          if grep -q "跳过：未设置 SQARVO_MARIADB_URL" "${LOG}"; then
            echo "::error::用例进入了跳过分支，SQARVO_MARIADB_URL 未生效"
            exit 1
          fi
          if ! grep -Eq 'Running.*tests/cross_catalog\.rs' "${LOG}"; then
            echo "::error::日志中缺少 Running tests/cross_catalog.rs，用例未执行"
            exit 1
          fi

          PASSED="$(grep -o 'test result: ok\. [0-9]* passed' "${LOG}" \
            | tail -n1 | grep -o '[0-9]*' || true)"
          echo "实际通过用例数：${PASSED:-<未解析到>} / 发现 ${DISCOVERED}"
          if [ -z "${PASSED}" ] || [ "${PASSED}" -le 0 ]; then
            echo "::error::通过用例数为 0 或缺失，测试未真实执行"
            exit 1
          fi
          if [ "${PASSED}" -ne "${DISCOVERED}" ]; then
            echo "::error::通过用例数 ${PASSED} 与发现数 ${DISCOVERED} 不一致"
            exit 1
          fi

          exit "${STATUS}"

      # 失败时保留证据：日志只包含测试专用连接参数，不含任何真实凭据。
      - name: 上传测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-tests-log
          path: |
            backend/mariadb-tests.log
            backend/cross-catalog-tests.log
          if-no-files-found: warn

  # Windows / macOS 前端尚未接入后端，且需要对应平台 SDK，
  # 因此暂不纳入 CI。接入后应各自增加构建任务。
