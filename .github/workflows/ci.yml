name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（Linux）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # protoc 由构建脚本内置，无需额外安装。
      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test

      # SQLite 覆盖单独列出：这些用例不需要任何外部服务，必须每次都真实执行，
      # 不能因为测试文件缺失或被过滤而静默跳过（v0.1 退出标准要求）。
      - name: SQLite 驱动测试（类型映射与截断）
        run: cargo test -p sqarvo-driver-sqlite --test type_mapping -- --nocapture

      - name: SQLite gRPC 端到端（UDS + 临时库）
        run: cargo test -p sqarvo-rpc-server --test grpc_sqlite_e2e -- --nocapture

  # MariaDB 集成测试单独成作业：服务容器启动失败或驱动回归不应掩盖 SQLite 覆盖，
  # 反之亦然。账号/密码/库名与 tests/integration/docker-compose.yml 完全一致
  # （测试专用值，不是真实凭据，因此不引入任何 secret）。
  mariadb-tests:
    name: MariaDB 集成测试（服务容器）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: sqarvo_test
          MARIADB_PASSWORD: sqarvo_test_only
          MARIADB_DATABASE: sqarvo_test
          MARIADB_ROOT_PASSWORD: sqarvo_root_test_only
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # 健康检查通过后端口理论上已就绪，仍显式探测一次，避免步骤卡在连接超时上。
      - name: 等待 MariaDB 端口
        run: |
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; do sleep 1; done'
          echo "127.0.0.1:3306 已可连接"

      # 断言逻辑说明见 tests/integration/README.md「CI」小节：
      # 用例被过滤成 0 个、或整批被跳过，都必须让作业变红。
      - name: MariaDB 驱动集成测试
        env:
          SQARVO_MARIADB_URL: mysql://sqarvo_test:sqarvo_test_only@127.0.0.1:3306/sqarvo_test
          # CI 输出里 cargo 仍会带 ANSI 颜色（"Running" 与控制台转义被拆开），
          # 会让下面的日志断言误判，日志本身也不便于阅读。
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          LOG=mariadb-tests.log

          # 1. 先取「发现数」：--list 不执行用例，只列出编译期注册的测试。
          DISCOVERED="$(cargo test -p sqarvo-driver-mariadb --test integration -- --list \
            | grep -c ': test' || true)"
          echo "发现用例数：${DISCOVERED}"
          if [ "${DISCOVERED}" -eq 0 ]; then
            echo "::error::未发现任何 MariaDB 用例（测试文件缺失或被过滤）"
            exit 1
          fi

          # 2. 真实执行，保留完整日志（pipefail 保证 cargo 的失败状态不被 tee 吞掉）。
          STATUS=0
          cargo test -p sqarvo-driver-mariadb --test integration -- --nocapture 2>&1 \
            | tee "${LOG}" || STATUS=$?

          # 3. 断言用例没有被跳过（未设置变量的跳过路径）。
          if grep -q "跳过：未设置 SQARVO_MARIADB_URL" "${LOG}"; then
            echo "::error::用例进入了跳过分支，SQARVO_MARIADB_URL 未生效"
            exit 1
          fi

          # 4. 断言集成测试二进制确实被执行（而不是只跑了单元测试）。
          # 用 .* 容忍可能的 ANSI 控制序列，避免颜色码把 "Running" 与路径拆开。
          if ! grep -Eq 'Running.*tests/integration\.rs' "${LOG}"; then
            echo "::error::日志中缺少 Running tests/integration.rs，集成测试未执行"
            exit 1
          fi

          # 5. 解析实际通过数，要求 > 0 且等于发现数（不允许部分用例被静默丢弃）。
          PASSED="$(grep -o 'test result: ok\. [0-9]* passed' "${LOG}" \
            | tail -n1 | grep -o '[0-9]*' || true)"
          echo "实际通过用例数：${PASSED:-<未解析到>} / 发现 ${DISCOVERED}"
          if [ -z "${PASSED}" ]; then
            echo "::error::日志中缺少 'test result: ok. N passed'"
            exit 1
          fi
          if [ "${PASSED}" -le 0 ]; then
            echo "::error::通过用例数为 0，测试未真实执行"
            exit 1
          fi
          if [ "${PASSED}" -ne "${DISCOVERED}" ]; then
            echo "::error::通过用例数 ${PASSED} 与发现数 ${DISCOVERED} 不一致"
            exit 1
          fi

          exit "${STATUS}"

      # 失败时保留证据：日志只包含测试专用连接参数，不含任何真实凭据。
      - name: 上传测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-tests-log
          path: backend/mariadb-tests.log
          if-no-files-found: warn

  # Windows / macOS 前端尚未接入后端，且需要对应平台 SDK，
  # 因此暂不纳入 CI。接入后应各自增加构建任务。
