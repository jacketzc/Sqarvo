# 仅供本地驱动集成测试使用。
# 密码是测试专用值，不得用于任何真实环境。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sqarvo_test
      POSTGRES_PASSWORD: sqarvo_test_only
      POSTGRES_DB: sqarvo_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqarvo_test -d sqarvo_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_USER: sqarvo_test
      MARIADB_PASSWORD: sqarvo_test_only
      MARIADB_DATABASE: sqarvo_test
      MARIADB_ROOT_PASSWORD: sqarvo_root_test_only
    ports:
      - "127.0.0.1:53306:3306"
    # 入口脚本只在数据卷首次初始化时执行：`sqarvo_test_b` 是跨库表数据用例
    # （#140 / ADR 0024）要用的第二个库，已存在的实例需要手工建库并授权。
    volumes:
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-usqarvo_test", "-psqarvo_test_only"]
      interval: 5s
      timeout: 3s
      retries: 20
