<?xml version="1.0" encoding="UTF-8"?>
<!--
  「第一页」：竖条 + 左尖括号（`|<`），v0.2.3.4 起取代主题的 `go-first-symbolic`。
  `go-first-symbolic` 是双尖括号 `«`，与旁边「上一页」的单尖括号 `‹` 只差一条线，
  11px 下几乎分不出来；「竖条 + 单尖括号」能把「跳到第一页」读成一个独立的动作。

  与 `sqarvo-filter-symbolic` 同一套画法：16×16 盒、固定深灰、由 GTK 按主题
  前景色重着色。竖条用实心矩形（小尺寸下描边会糊），尖括号用 1.8 描边、圆头。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="2.8" y="1.8" width="1.4" height="12.4" rx="0.7" fill="#2e3436"/>
  <!-- 尖括号是**填充**路径而不是描边：GTK 的符号图标重着色会用 alpha 阈值把
       1px 描边放粗，相邻两笔在 11px 下会糊成实心三角；换成带内孔的闭合路径，
       内孔在任何尺寸都留得住。 -->
  <path fill="#2e3436" d="M12.5 1.8 6.6 8l5.9 6.2v-2.2L8.6 8l3.9-4z"/>
</svg>