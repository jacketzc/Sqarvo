[package]
name = "sqarvo-desktop"
description = "Sqarvo Linux 桌面客户端（GTK4 + libadwaita）"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6", "gtk_v4_10"] }
async-channel = "2"
directories = "6"
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"
