[package]
name = "sqarvo-local-store"
description = "Sqarvo 本地路径、IPC 端点描述、会话 token 与凭据引用"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
sqarvo-common.workspace = true
sqarvo-driver-api.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

# Secret Service 走 D-Bus；只有 Linux 需要（zbus 的 blocking API，见 credentials 模块文档）。
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

# Windows 需要两件系统 API：端点文件/目录的显式 DACL（`SetNamedSecurityInfoW`、
# `ConvertStringSecurityDescriptorToSecurityDescriptorW`、token 查 SID）与 Windows
# Credential Manager（`CredWriteW` / `CredReadW` / `CredDeleteW`）。
#
# 只在 `cfg(windows)` 目标上编译，Linux 构建完全不引入这些符号；版本 0.61 与
# `backend/Cargo.lock` 里已有的传递依赖（directories / rustix / anstream 等）一致，
# 不引入第二个 windows-sys 版本。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
