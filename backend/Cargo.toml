[workspace]
resolver = "3"
members = [
    "apps/backend-service",
    "crates/common",
    "crates/connection",
    "crates/driver-api",
    "crates/driver-testkit",
    "crates/drivers",
    "crates/drivers/sqlite",
    "crates/local-store",
    "crates/metadata",
    "crates/query-engine",
    "crates/rpc-server",
    "crates/transaction",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Sqarvo contributors"]

[workspace.dependencies]
sqarvo-common = { path = "crates/common" }
sqarvo-connection = { path = "crates/connection" }
sqarvo-driver-api = { path = "crates/driver-api" }
sqarvo-driver-testkit = { path = "crates/driver-testkit" }
sqarvo-drivers = { path = "crates/drivers" }
sqarvo-local-store = { path = "crates/local-store" }
sqarvo-metadata = { path = "crates/metadata" }
sqarvo-query-engine = { path = "crates/query-engine" }
sqarvo-rpc-server = { path = "crates/rpc-server" }
sqarvo-transaction = { path = "crates/transaction" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = "debuginfo"
