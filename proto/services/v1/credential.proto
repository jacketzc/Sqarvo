syntax = "proto3";

package sqarvo.services.v1;

import "common/v1/common.proto";

// 凭据域：把数据库密码写入/删除操作系统凭据库（ADR 0012、ADR 0016）。
//
// 这是前后端契约中**唯一**允许传输数据库密码的接口，存在的理由是安全边界：
//
// - 密码只进系统凭据库（Linux Secret Service、Windows Credential Manager、
//   macOS Keychain），绝不写进连接配置文件、日志、错误文案或端点描述文件；
// - 前端在写配置前先调用 `StoreCredential` 拿到引用，配置里只保留
//   `credential_ref`，因此磁盘上永远没有明文密码；
// - 密码只在本次 RPC 的请求体内存在，后端用完即丢，不缓存、不回显。
//
// 传输层是本地 IPC（Unix 域套接字，0600 端点文件里的会话 token 鉴权，见
// `docs/decisions/0002-local-ipc-transport.md`），明文密码不经网络、不经 TLS 隧道，
// 也不落盘；这条取舍写在 ADR 0016 的「取舍」一节。
service CredentialService {
  // 写入或覆盖一个凭据，返回最终使用的引用。
  //
  // 引用不存在时创建；同一引用重复写入覆盖旧值（不做版本化，ADR 0012）。
  // 系统凭据库不可用或被锁定时返回 UNAVAILABLE + `credential.unavailable`，
  // 不会回退到明文存储。
  rpc StoreCredential(StoreCredentialRequest) returns (StoreCredentialResponse);

  // 删除一个凭据。
  //
  // 引用不存在视为成功（幂等）；引用格式非法返回 INVALID_ARGUMENT +
  // `config.invalid`。
  rpc DeleteCredential(DeleteCredentialRequest) returns (sqarvo.common.v1.Empty);
}

message StoreCredentialRequest {
  // 目标引用，形如 `sqarvo:conn/<uuid-v4>`（ADR 0012）。
  //
  // 为空表示由服务端生成一个新的随机引用（新建连接）；非空时必须是合法引用，
  // 否则返回 INVALID_ARGUMENT + `config.invalid`。引用里禁止编码主机、用户名或库名。
  string credential_ref = 1;

  // 数据库密码原文。
  //
  // 安全约束：本字段只在本 RPC 内存在，不得写入日志、错误文案、Debug 输出、
  // 端点描述文件或任何配置文件。前端不得把它写进 connections.json，
  // 后端不得把它放进 `Secret` 之外的结构。
  // 空字符串不被接受（返回 config.invalid）：proto3 无法区分「没传」与「传了空密码」，
  // 若允许空值，客户端漏填字段就会静默覆盖掉已保存的密码。
  string secret = 2;
}

message StoreCredentialResponse {
  // 实际使用的引用：请求里给了就原样返回，没给则是服务端生成的新引用。
  // 客户端必须把它写进连接配置，之后的 Connect/TestConnection 只引用它。
  string credential_ref = 1;
}

message DeleteCredentialRequest {
  // 要删除的引用；格式不合法返回 INVALID_ARGUMENT + `config.invalid`。
  string credential_ref = 1;
}
