syntax = "proto3";

package sqarvo.services.v1;

import "common/v1/common.proto";
import "common/v1/value.proto";
import "services/v1/metadata.proto";

// 表数据域：按主键升序浏览表数据、提交行级变更（ADR 0017）。
//
// 三条硬约束：
//
// 1. 浏览只按主键升序 + 不透明 cursor，**禁止** OFFSET 分页；cursor 语义与
//    QueryService 的结果集游标一致（客户端只能原样回传，不得解析）；
// 2. 无主键表只读浏览并标注「无稳定排序」，编辑一律拒绝，不提供 rowid / ctid
//    之类的近似定位；
// 3. 行变更只传「主键值 + 列变更」的强类型值，驱动内部以 prepared statement
//    绑定参数执行，服务端绝不拼接 SQL 字符串。
//
// 不支持的能力必须返回 `capability.unsupported`（驱动未实现行编辑）或
// `table_data.no_primary_key`（无主键），不得静默降级为「尽力而为」的写入。
//
// 行变更批次可取消（#70，ADR 0018）：
//
// * 每个批次有一个 `query_id`（客户端生成，格式与 QueryService 的 query_id 相同：
//   `query_<uuid>`）。取消用 `CancelRowChanges`，**不复用** `QueryService.Cancel`：
//   后者的语义是「释放查询游标」，与写入批次的生命周期不同（ADR 0018 记了取舍）；
// * 取消在**行边界**生效：已开始的那一条变更执行完，后续变更不再执行；
// * 自动提交模式（`transaction_id` 为空）取消后**整批回滚**，库里不留半批；
// * 事务模式下取消只回滚本批（savepoint），外层事务仍然可用（可继续写、可提交或回滚）；
// * 取消幂等：重复取消、取消已完成/不存在的批次都返回成功（`Empty`）。
service TableDataService {
  rpc BrowseTable(BrowseTableRequest) returns (BrowseTableResponse);
  rpc ApplyRowChanges(ApplyRowChangesRequest) returns (ApplyRowChangesResponse);
  // 取消一个正在执行的行变更批次。见文件头「行变更批次可取消」。
  //
  // 这条 RPC **不等待**会话执行锁：它只把该批次的取消令牌置位后立刻返回，
  // 因此「取消一个正在跑的批次」不会排在批次后面等到天荒地老。
  // 驱动未实现取消时返回 `capability.unsupported`（绝不静默成功）。
  rpc CancelRowChanges(CancelRowChangesRequest) returns (sqarvo.common.v1.Empty);
  // 插入新行（v0.2.2 追加，#81）。
  //
  // 单行插入就是 `rows` 只有一条，**不**另立 `InsertRow` RPC：单行与批量必须走
  // 同一套校验、风险阈值与原子性，两套 RPC 迟早长出两套语义。
  //
  // 语义摘要（完整规则见 `InsertRowsRequest` / `InsertRowsResponse`）：
  //
  // * **省略列 vs 显式 NULL**：省略的列交给数据库默认值（自增、`DEFAULT` 表达式、
  //   `DEFAULT NULL` 都算），显式 `VALUE_KIND_NULL` 表示写入 SQL NULL。二者必须
  //   可区分——用「没给值」冒充 NULL 会把自增列写成 0；
  // * **主键回传**：成功行回传插入后的**完整**主键值（含数据库生成的自增值），
  //   复合主键回传全部列值；前端据此定位新行并继续编辑；
  // * **原子性**：与 `ApplyRowChanges` 同一信封——无 `transaction_id` 时整批成功
  //   才提交，指定事务时用 savepoint；
  // * **风险阈值**：沿用 `acknowledge_risk` 与 `DEFAULT_RISK_CONFIRMATION_ROWS`
  //   （100 行），不另立阈值。
  //
  // 本版插入批次**不可取消**：没有 `query_id` 字段。若后续需要，追加字段并复用
  // `CancelRowChanges` 即可，不必改既有字段号。
  rpc InsertRows(InsertRowsRequest) returns (InsertRowsResponse);
}

// 浏览结果的排序保证。
enum RowOrder {
  ROW_ORDER_UNSPECIFIED = 0;
  // 按主键升序；游标翻页期间稳定。
  ROW_ORDER_PRIMARY_KEY_ASCENDING = 1;
  // 无稳定排序（无主键表）。只允许只读浏览，不得用于编辑定位。
  ROW_ORDER_UNSTABLE = 2;
}

// 只读原因。可编辑时 read_only=false 且本字段为 READ_ONLY_REASON_UNSPECIFIED。
enum ReadOnlyReason {
  READ_ONLY_REASON_UNSPECIFIED = 0;
  // 表没有主键：无法稳定定位行，编辑被拒绝（`table_data.no_primary_key`）。
  READ_ONLY_REASON_NO_PRIMARY_KEY = 1;
  // 驱动未声明行编辑能力（`capability.unsupported`）。
  READ_ONLY_REASON_DRIVER_UNSUPPORTED = 2;
  // 连接以只读方式打开（SQLite `read_only` 参数）。浏览可用且仍按主键升序，
  // 但写入一定被数据库拒绝（`table_data.read_only`），因此浏览时就置只读。
  // 只读事务属于会话级状态，由事务徽标与写入拒绝表达，不复用本值（ADR 0017）。
  // 追加取值：旧客户端读到未知值时会落到 UNSPECIFIED，仍按只读处理，不会显示可编辑。
  READ_ONLY_REASON_CONNECTION_READ_ONLY = 3;
}

message BrowseTableRequest {
  // 目标表/视图。kind 必须与对象实际种类一致。
  ObjectRef object = 1;
  // 期望行数；0 表示服务端默认值（100）。超过单批上限（500）被服务端钳制，
  // 不返回错误。
  uint32 page_size = 2;
  // 上一页返回的不透明 cursor；为空表示第一页。
  string page_token = 3;
}

message BrowseTableResponse {
  // 列元数据，顺序与每行 values 一致。
  repeated sqarvo.common.v1.ColumnMeta columns = 1;
  // 本页行数据。
  repeated sqarvo.common.v1.Row rows = 2;
  // 下一页 cursor；has_more=false 时为空。客户端不得解析其内容。
  string next_page_token = 3;
  // 是否还有更多数据。
  bool has_more = 4;
  // 是否只读。只读时前端必须显式展示不可编辑。
  bool read_only = 5;
  // 只读原因；可编辑时为 READ_ONLY_REASON_UNSPECIFIED。
  ReadOnlyReason read_only_reason = 6;
  // 排序保证。
  RowOrder ordering = 7;
}

// 主键中一列的值。复合主键必须给出全部列，顺序与 GetPrimaryKey 返回的顺序一致。
message PrimaryKeyValue {
  string column = 1;
  // 主键值；NULL 不是合法主键值，服务端必须拒绝。
  sqarvo.common.v1.ColumnValue value = 2;
}

// 定位一行的完整主键值。
message RowKey {
  repeated PrimaryKeyValue values = 1;
}

// 单列变更。
message ColumnChange {
  string column = 1;
  // 新值。设为 NULL 必须显式给 kind=VALUE_KIND_NULL，不能靠省略该列表达。
  sqarvo.common.v1.ColumnValue value = 2;
}

message RowUpdate {
  RowKey key = 1;
  // 列变更；空列表视为无效请求（`config.invalid`）。
  repeated ColumnChange changes = 2;
  // 期望受影响行数；0 表示「未设置」，服务端按 1 处理。
  // 实际行数与之不符时该行返回 CHANGE_OUTCOME_CONFLICT 与
  // `table_data.rows_affected_mismatch` 语义。
  uint64 expected_rows_affected = 3;
}

message RowDelete {
  RowKey key = 1;
  // 期望受影响行数；0 表示「未设置」，服务端按 1 处理。
  // 目标行已不存在时该行返回 CHANGE_OUTCOME_ROW_NOT_FOUND。
  uint64 expected_rows_affected = 2;
}

message ApplyRowChangesRequest {
  string session_id = 1;
  ObjectRef object = 2;
  // 所属事务；为空表示自动提交。非空且会话没有该事务时返回
  // `transaction.not_found`（绝不退化成自动提交）。
  string transaction_id = 3;
  // 更新列表，按顺序执行。
  repeated RowUpdate updates = 4;
  // 删除列表，在 updates 之后按顺序执行。
  repeated RowDelete deletes = 5;
  // 风险确认。预计影响行数超过服务端阈值（默认 100 行）时必须为 true，
  // 否则返回 `table_data.confirmation_required`。
  bool acknowledge_risk = 6;
  // 批次 ID，供 `CancelRowChanges` 定位（#70）。格式与 QueryService 的 query_id 相同
  // （`query_<uuid>`，也可只给 UUID）。由**客户端**生成：一元 RPC 在返回前无法把
  // 服务端生成的 ID 告诉调用方，只有客户端提供的 ID 才可能在执行期间被取消。
  //
  // 空字符串表示「本批次不可取消」：服务端会自己生成一个 ID 并在响应里回显
  // （`ApplyRowChangesResponse.query_id`），但此时调用方已经无法用它取消——v0.3 起的
  // 客户端必须自己提供。同一 ID 不得并发复用（`query.id_in_use`），避免把取消
  // 打到别人的批次上。
  string query_id = 7;
}

enum ChangeOutcome {
  CHANGE_OUTCOME_UNSPECIFIED = 0;
  CHANGE_OUTCOME_APPLIED = 1;
  // 目标行已不存在（已被其它会话删除）。
  CHANGE_OUTCOME_ROW_NOT_FOUND = 2;
  // 影响行数与期望不符（乐观并发冲突）。
  CHANGE_OUTCOME_CONFLICT = 3;
}

message RowChangeResult {
  // 请求内下标：updates 在前、deletes 在后，各自按请求顺序，从 0 开始。
  uint32 change_index = 1;
  ChangeOutcome outcome = 2;
  // 驱动 DML 语句实际影响的行数——**不论 outcome 是什么都填真实值**，调用方不得用它
  // 判断成败（成败只看 outcome）：
  //   APPLIED      → 应用的行数（必须等于 expected_rows_affected）；
  //   CONFLICT     → 冲突时真实影响的行数，主键不唯一/定义损坏时可能 > 1；
  //   ROW_NOT_FOUND→ 0（该分支的判定条件就是实际影响 0 行）。
  // 这样「一行都没动」与「动了多行但被拒」可区分；恒为 0 会让用户只能猜。
  uint64 rows_affected = 3;
  // 可安全展示的原因说明；不得包含 SQL、参数值或凭据。
  string message = 4;
}

message ApplyRowChangesResponse {
  repeated RowChangeResult results = 1;
  // 本批驱动实际影响的行数合计 = Σ results[i].rows_affected，**包含**被判为冲突的行：
  // 逐行冲突只改变 outcome，不会回滚已执行的 DML（整批原子性只由语句级错误与 savepoint
  // 保证）。把它们从合计里抹掉会让界面显示「影响 0 行」，而库里其实已经改了若干行。
  //
  // 被取消时恒为 0：已执行的行已随批次回滚，数据库净变化为零（ADR 0018）。
  uint64 total_rows_affected = 2;
  // 请求超过单批上限（500 行）时为 true：只执行了前 500 条。
  bool clamped = 3;
  // 因钳制而未执行的变更数；大于 0 时客户端必须续传剩余变更。
  uint32 deferred_changes = 4;
  // 本批次是否被 `CancelRowChanges` 取消（ADR 0018）。
  //
  // 取消是**正常结果**而不是错误：客户端据此显示「已取消」并丢弃本批结果。
  // true 时 `results` 为空、`total_rows_affected` 为 0——已执行的行都回滚了，
  // 回报这些行会让界面显示「改了 200 行」而库里一行没动。
  bool cancelled = 5;
  // 取消发生前驱动**已执行**的变更条数（含随后回滚的那些），证明「真的跑到一半」。
  // 仅 `cancelled = true` 时有意义；未取消时为 0。
  // 取值满足 0 ≤ executed_changes < 请求变更数：取消在行边界生效。
  uint32 executed_changes = 6;
  // 本批次的 ID（回显请求里的 `query_id`；请求留空时为服务端生成的值）。
  string query_id = 7;
}

// 取消一个行变更批次。
message CancelRowChangesRequest {
  // `ApplyRowChangesRequest.query_id`。未知/已结束的批次视为「无需再取消」，返回成功。
  string query_id = 1;
}

// 要插入的一行（v0.2.2 追加，#81）。
//
// 只给**要写的列**。省略与显式 NULL 是两件事：
//
// | 表达 | 语义 | 例子 |
// |---|---|---|
// | 该列不在 `values` 里 | 交给数据库默认值：自增、`DEFAULT` 表达式、`DEFAULT NULL` | 不写 `id`，拿到 42 |
// | `kind = VALUE_KIND_NULL` | 写入 SQL NULL | 明确把可空列写空 |
// | `kind = VALUE_KIND_UNSPECIFIED` | 非法（`config.invalid`） | —— |
//
// 「有没有默认值」由 `GetColumns` 的 `ColumnMeta.default_value` 四态表达
// （未设置 / 无默认值 / 默认 NULL / 未求值表达式，见 `common/v1/value.proto`）。
// 服务端**不**替用户把「省略」改写成默认值字面量：自增与 `now()` 这类默认值只有
// 数据库知道，代填等于伪造。
//
// 被截断的值（`ColumnValue.truncated = true`）不得写入（`table_data.truncated_value`）。
message InsertRow {
  // 列 → 值。列名重复、列不存在、同一列既省略又给出都是非法请求（`config.invalid`）。
  repeated ColumnChange values = 1;
}

message InsertRowsRequest {
  string session_id = 1;
  // 目标表。视图不可插入（`table_data.read_only`）；驱动不支持插入时
  // `capability.unsupported`，**不得**静默跳过。
  ObjectRef object = 2;
  // 所属事务；为空表示自动提交。非空且会话没有该事务时返回
  // `transaction.not_found`（绝不退化成自动提交）。
  //
  // 事务模式下的批次以 `SAVEPOINT` 包裹：本批失败只回滚到该 savepoint，外层事务
  // 仍然可用（可继续写、可提交或回滚）。自动提交模式下本批使用**一个**隐式事务，
  // 覆盖整批行。
  string transaction_id = 3;
  // 按顺序插入的行。空列表是非法请求（`config.invalid`），不是「插入 0 行」。
  repeated InsertRow rows = 4;
  // 风险确认。预计影响行数（= 本批行数 × 1）超过服务端阈值（默认 100 行，
  // `DEFAULT_RISK_CONFIRMATION_ROWS`）时必须为 true，否则整批返回
  // `table_data.confirmation_required`（FAILED_PRECONDITION），一行都不执行。
  // 阈值沿用行变更的既有阈值，**不**另立一套。
  bool acknowledge_risk = 5;
}

// 单行插入的结果（v0.2.2 追加，#81）。
enum InsertOutcome {
  INSERT_OUTCOME_UNSPECIFIED = 0;
  // 该行的 INSERT 语句执行成功。注意：批次是否最终落库还看
  // `InsertRowsResponse.rolled_back`——整批回滚时本字段仍是 INSERTED，
  // 但行已经不存在（契约要求客户端以 `rolled_back` 为准）。
  INSERT_OUTCOME_INSERTED = 1;
  // 该行失败（唯一冲突、NOT NULL、无权限等）。其余行继续执行，便于一次报出全部
  // 问题；整批原子性仍由 `rolled_back` 表达。
  INSERT_OUTCOME_FAILED = 2;
}

message InsertRowResult {
  // 请求内下标，从 0 开始，与 `InsertRowsRequest.rows` 对齐。
  uint32 row_index = 1;
  InsertOutcome outcome = 2;
  // 插入后的**完整**主键值：自增/默认值生成的主键列回传数据库真实值，其余主键列
  // 回传写入值；复合主键按 `GetPrimaryKey` 的顺序给出全部列。
  // 仅 `outcome = INSERTED` 且批次未回滚时才有意义；FAILED 或整批回滚时为空。
  //
  // 驱动若无法回传生成后的完整主键（例如只拿到自增值、复合主键的其它列来自
  // 服务端默认值），**不得**编造或部分回传：这种情况不能声明支持插入，必须让
  // `supports_row_insertion()` 保持 false。
  RowKey key = 3;
  // 该行驱动的真实影响行数：INSERTED 为 1，FAILED 为 0。全部行合计见
  // `InsertRowsResponse.total_rows_affected`。
  uint64 rows_affected = 4;
  // 该行的稳定错误码（仅 FAILED 时有值），例如 `table_data.unique_violation`、
  // `table_data.not_null_without_default`、`table_data.column_not_insertable`、
  // `table_data.permission_denied`。前端据此逐行提示，不必解析文案。
  string error_code = 5;
  // 可安全展示的原因说明；不得包含 SQL、参数值或凭据。
  string message = 6;
}

message InsertRowsResponse {
  repeated InsertRowResult results = 1;
  // 本批**净**影响行数：未回滚时 = Σ results[i].rows_affected（即成功行数）；
  // `rolled_back = true` 时恒为 0——行都已回滚，报 N 会让界面显示「插入了 N 行」
  // 而库里一行没有。
  uint64 total_rows_affected = 2;
  // 请求超过单批上限（500 行）时为 true：只执行了前 500 行。
  bool clamped = 3;
  // 因钳制而未执行的行数；大于 0 时客户端必须续传剩余行。
  uint32 deferred_rows = 4;
  // 整批是否已回滚。**客户端判定「插入成功」必须看本字段，不能只看逐行 outcome。**
  //
  // - 自动提交模式：任一行失败 → 整批回滚（本字段 true），数据库净变化为零；
  // - 事务模式：任一行失败 → `ROLLBACK TO SAVEPOINT`（本字段 true），外层事务仍可用。
  //
  // 逐行结果仍然全部返回：用户需要知道**哪几行**冲突，而不是只知道「整批失败了」。
  // 单行失败不中断其余行，正是为了把问题一次报全；代价是「一行坏、整批弃」，
  // 取舍见 ADR 0019。
  bool rolled_back = 5;
  // 成功插入的行数（outcome = INSERTED 的条数），**不受** `rolled_back` 影响：
  // 它回答「语句层成功了几行」，与 `total_rows_affected`（净变化）分工不同。
  uint32 inserted_rows = 6;
}
