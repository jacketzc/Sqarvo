syntax = "proto3";

package sqarvo.common.v1;

// 单元格值的逻辑类型。
//
// 刻意不使用「一切皆字符串」模型：NULL、整数、无符号整数、浮点、Decimal、
// 二进制、日期时间必须可区分。无法无损映射的数据库特有类型使用
// VALUE_KIND_UNSUPPORTED，并保留原始类型名与文本表示。
enum ValueKind {
  VALUE_KIND_UNSPECIFIED = 0;
  VALUE_KIND_NULL = 1;
  VALUE_KIND_BOOL = 2;
  VALUE_KIND_INT64 = 3;
  VALUE_KIND_UINT64 = 4;
  VALUE_KIND_FLOAT64 = 5;
  VALUE_KIND_DECIMAL = 6;
  VALUE_KIND_TEXT = 7;
  VALUE_KIND_BYTES = 8;
  VALUE_KIND_DATE = 9;
  VALUE_KIND_TIME = 10;
  // 无时区的时间戳。
  VALUE_KIND_DATETIME = 11;
  // 带时区偏移的时间戳。
  VALUE_KIND_TIMESTAMP = 12;
  VALUE_KIND_JSON = 13;
  VALUE_KIND_UUID = 14;
  VALUE_KIND_ARRAY = 15;
  VALUE_KIND_UNSUPPORTED = 16;
}

// 精确十进制值。unscaled_value 为十进制整数字面量（可带负号），
// 实际值 = unscaled_value * 10^(-scale)。绝不通过 double 传输。
message DecimalValue {
  string unscaled_value = 1;
  int32 scale = 2;
}

// 本地日期时间分量，用于 DATE / TIME / DATETIME。
message DateTimeValue {
  int32 year = 1;
  uint32 month = 2;
  uint32 day = 3;
  uint32 hour = 4;
  uint32 minute = 5;
  uint32 second = 6;
  uint32 nanosecond = 7;
}

// UTC 纳秒时间戳 + 显示用偏移。
message TimestampValue {
  int64 unix_nanos = 1;
  int32 offset_seconds = 2;
}

message ArrayValue {
  repeated ColumnValue elements = 1;
}

// 单个单元格。kind 与 value 必须一致；NULL 只有 kind。
message ColumnValue {
  ValueKind kind = 1;
  oneof value {
    bool bool_value = 2;
    int64 int64_value = 3;
    uint64 uint64_value = 4;
    double float64_value = 5;
    DecimalValue decimal_value = 6;
    string text_value = 7;
    bytes bytes_value = 8;
    DateTimeValue date_value = 9;
    DateTimeValue time_value = 10;
    DateTimeValue datetime_value = 11;
    TimestampValue timestamp_value = 12;
    string json_value = 13;
    string uuid_value = 14;
    ArrayValue array_value = 15;
    string unsupported_value = 16;
  }
  // 大字段按策略截断时为 true，此时 value 只包含前缀。
  bool truncated = 17;
  // 数据库原始类型名，例如 `varchar(64)`、`timestamptz`。
  string original_type_name = 18;
}

// 列的逻辑类型。
enum ColumnTypeKind {
  COLUMN_TYPE_UNSPECIFIED = 0;
  COLUMN_TYPE_BOOLEAN = 1;
  COLUMN_TYPE_INTEGER = 2;
  COLUMN_TYPE_FLOAT = 3;
  COLUMN_TYPE_DECIMAL = 4;
  COLUMN_TYPE_TEXT = 5;
  COLUMN_TYPE_BINARY = 6;
  COLUMN_TYPE_DATE = 7;
  COLUMN_TYPE_TIME = 8;
  COLUMN_TYPE_DATETIME = 9;
  COLUMN_TYPE_TIMESTAMP = 10;
  COLUMN_TYPE_JSON = 11;
  COLUMN_TYPE_UUID = 12;
  COLUMN_TYPE_ARRAY = 13;
  COLUMN_TYPE_UNSUPPORTED = 14;
}

message ColumnType {
  ColumnTypeKind kind = 1;
  // 数据库原始类型名，始终保留。
  string original_type_name = 2;
  optional uint32 precision = 3;
  optional int32 scale = 4;
  optional uint32 length = 5;
  optional bool unsigned = 6;
  optional uint32 bits = 7;
  optional bool with_time_zone = 8;
  // 数组元素类型；仅 COLUMN_TYPE_ARRAY 使用。
  ColumnType element_type = 9;
}

// 列默认值的状态。三态必须可区分：不能用空串冒充「没有默认值」。
enum ColumnDefaultKind {
  // 未指定。服务端不发出该值；收到时按「未知」处理。
  COLUMN_DEFAULT_UNSPECIFIED = 0;
  // 该列**明确没有**默认值：插入时不提供值会被数据库拒绝（NOT NULL 列）。
  COLUMN_DEFAULT_NONE = 1;
  // 默认值就是 SQL NULL（`DEFAULT NULL`）。与「没有默认值」不同，
  // 也与空字符串不同：NULL 是有效默认值，空串是文本默认值。
  COLUMN_DEFAULT_NULL = 2;
  // 默认值是一段**未求值**的 SQL 文本，见 ColumnDefault.expression。
  COLUMN_DEFAULT_EXPRESSION = 3;
}

// 列默认值。
message ColumnDefault {
  ColumnDefaultKind kind = 1;
  // 默认值的原始 SQL 文本，仅当 kind = COLUMN_DEFAULT_EXPRESSION 时有意义。
  //
  // 驱动原样透传数据库给出的文本：不求值、不去引号、不做大小写归一。
  // 例如 SQLite 的 `'abc'`、`(datetime('now'))`、`CURRENT_TIMESTAMP`，
  // MariaDB 的 `current_timestamp()`、`'0'`。前端必须把它当作表达式展示，
  // 不得当成已求值的字面量值，也不得据此推断默认值的运行时类型。
  string expression = 2;
}

// 列元数据。nullable 与原始类型信息必须随结果集返回。
message ColumnMeta {
  string name = 1;
  uint32 ordinal = 2;
  ColumnType type = 3;
  bool nullable = 4;
  // 默认值。字段**未设置**表示「未知」：老服务端不设置该字段，或者该列
  // 元数据来自结果集（结果集没有默认值信息）。这与
  // `default_value.kind = COLUMN_DEFAULT_NONE`（明确没有默认值）不同，
  // 前端不得把「未知」渲染成「无默认值」。
  ColumnDefault default_value = 5;
  // 列级字符集名称，例如 `utf8mb4`。未设置表示「不适用或未知」：
  // SQLite 没有列级字符集概念，因此永远不设置；前端不得把它显示为「空字符集」，
  // 应按「不适用」处理。具体原因见 docs/database/{sqlite,mariadb}.md。
  optional string character_set = 6;
  // 列级排序规则名称，例如 `utf8mb4_general_ci`。语义同 character_set。
  optional string collation = 7;
}

message Row {
  repeated ColumnValue values = 1;
}

message ResultSetMeta {
  repeated ColumnMeta columns = 1;
  bool read_only = 2;
}
