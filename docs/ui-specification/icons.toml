# 图标语义表（三端按 id 取同一枚，不从俗）
#
# 规则（AGENTS §8.6 / §8.1）：组件只说「这里要哪一枚语义图标」（`style.icon = ["<id>"]`），
# 各端按本表落到自己的字形。新增 id 必须有代码依据：`linux` 名必须能在
# `frontend/linux/src/*.rs` 的字符串字面量里找到；`sqarvo-` 前缀的自有图标还要在
# `frontend/linux/resources/icons/<name>.svg` 里存在。校验器逐条核对。
#
# winui = Segoe MDL2 Assets 码点（4 位十六进制，Win10 1809+ 与 Win11 都自带该字体）；winui_name = 该码点在官方字形表里的名字，
# 两者必须成对出现，供 Windows 端与设计复核。来源：Microsoft Learn《Segoe Fluent Icons font》
# v1.56 字形表，2026-11-12 取：
# https://learn.microsoft.com/en-us/windows/apps/design/iconography/segoe-fluent-icons-font
#
# 选点原则：优先 E 段（Win10 的 Segoe MDL2 Assets 就有），F 段字形较新，Win10 目标机要目视确认。
# XAML 用 <FontIcon Glyph="&#xE710;" FontFamily="{ThemeResource SymbolThemeFontFamily}"/>，
# 不要用 Symbol 枚举（只覆盖一部分码点，写错不报错、只渲染成空格）。
# winui_note 非空表示「Segoe 没有等价字形，这是近似」——Windows 端不得当成语义精确匹配，
# 也不许为了对齐猜新的码点。
#
# swift 一律 `—`：macOS 端尚未接入。
#
# 图标语义共 40 条。
# 已移除 2 条无引用且无代码语义的排序方向重复登记（改动确认单 #5）

