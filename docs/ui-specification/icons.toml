# 图标语义表（三端按 id 取同一枚，不从俗）
#
# 规则（AGENTS §8.6 / §8.1）：组件只说「这里要哪一枚语义图标」（`style.icon = ["<id>"]`），
# 各端按本表落到自己的字形。新增 id 必须有代码依据：`linux` 名必须能在
# `frontend/linux/src/*.rs` 的字符串字面量里找到；`sqarvo-` 前缀的自有图标还要在
# `frontend/linux/resources/icons/<name>.svg` 里存在。校验器逐条核对。
#
# winui 用 Segoe Fluent Icons 的码点；本机没有 Windows 环境，未核对的写 `待核`，不许猜。
# swift 一律 `—`：macOS 端尚未接入。

