# 对话框功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 收什么：独立于某个动作、有自己生命周期的表面 —— 新建 / 编辑连接对话框、关于对话框。
# 不收什么：确认框跟随触发它的动作所属的区（关闭标签 → tabs，删除连接 / 断开连接 →
# object_tree，后端重启 → shell，脏行三选 → tabs），不在这里重复登记。
#
# 行为条目取自 ui-behavior-contract.md §1.2（工具条「连接」）、§1.4（文件 → 新建连接、
# 帮助 → 关于）、§2.3（编辑连接）、§7.1（Windows 新建连接对话框）；源码行号已按当前
# dialog.rs / driver_form.rs / ui.rs 逐行复核，函数名仍是一级定位。

[area]
id = "dialogs"
display_name = "对话框"
summary = "连接对话框（新建 / 编辑两种模式共用一张表面）与关于对话框。连接对话框是唯一配置连接参数、测试连接、把密码交给系统凭据库的入口；关于对话框只陈述版本、协议与后端诊断，不依赖后端可用。"
legacy_ref = "ui-behavior-contract.md §1.2 / §1.4 / §2.3 / §7.1（原章节已退役为指针，行为见本文件）"

[[component]]
id = "dialogs"
parent = ""
display_name = "对话框区"
kind = "area"
status = "active"
style.slot = "dialogs"
style.metrics = ["gap_page"]
impl_notes = [
  "只收独立于某个动作、有自己生命周期的表面：新建 / 编辑连接对话框、关于对话框。",
  "确认框跟随触发它的区：关闭标签确认在 tabs，删除 / 断开连接确认在 object_tree，后端重启确认在 shell —— 它们不是本区的组件。",
  "两个对话框都是 Attached Modal 表面（AdwDialog 附着主窗口呈现），不新开顶层窗口；同一时刻各只有一个实例。",
]

