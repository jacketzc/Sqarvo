kind = "control"
status = "active"
hand_drawn = true
why_not_native = "Linux 用原生 GtkPaned（vertical，L0）；WinUI 3 没有原生 splitter，Windows 自绘 Panel 把手（QuerySplitGrip，L2 复合件）：PointerPressed/Moved/Released 调 RowDefinition 高度，两端最小高度与默认比例读生成常量，同 #178 列宽拖拽口径。"
a11y.name = "（原生 GtkPaned 分栏，无独立可访问名）"
native_control = "gtk:GtkPaned（vertical） / winui:自绘 Panel 把手（QuerySplitGrip） / swift:—"
style.metrics = ["query_splitter_width", "query_editor_min_height", "query_results_min_height", "query_editor_ratio"]
style.tokens = ["sqarvo_separator"]
impl_notes = [
  "纵向 GtkPaned 替换旧固定 Separator（#189）：结果区隐藏时 GtkPaned 不测量也不绘制把手，编辑器占满整页；两端都可见时把手厚度来自主题 CSS（query_splitter_width）。",
  "确认单 #1（显示收敛）：普通模式把手**不绘制**——Linux CSS background 透明、Windows 中间 1px Rectangle Collapsed；query_splitter_width 厚度只作拖动热区，命中范围与改前逐像素一致。视觉边界只剩编辑器卡片底框与结果区的自然连接处；可发现性靠悬停热区时的系统 resize 光标（Linux GtkPaned 自带、Windows QuerySplitGrip 常驻 SizeNorthSouth），**不加 hover 显形**（决策已确认）。",
  "高对比例外保留静态分隔线（§8.6 HC 分支，HC 靠描边划区域边界）：Linux 按 stylesheet_for 的 high_contrast 参数出线；Windows 装配时按 ThemeService.HighContrast 决定 Rectangle 显隐，运行期切 HC 不即时刷新、重启生效（现有 SystemAppearanceChanged 链路只重设 RequestedTheme，覆盖不到该分支）。",
  "GtkPaned 的 min/max-position 只读：两端最小高度由子控件自身最小尺寸 + shrink=false 保证（编辑器 min_content_height=query_editor_min_height，结果区 size_request=query_results_min_height）。",
  "默认比例 query_editor_ratio（0.4，三档同值）；拖动回写只进内存（split_position），不持久化，下次显示时恢复；applying_split 防止程序化应用位置被记成拖动。",
  "GTK4 的 size-allocate 是虚函数不是信号：用结果区 map 信号 + 首次分配守卫在分配就绪后应用比例；首次分配前的 position 通知是 GtkPaned 钳制，不是用户拖动，不记录。",
  "密度档切换后 reapply_metrics 重应用两端最小高度与比例；把手厚度随主题 CSS 重建自动更新。",
  "可访问性现状（隔离 QA 只读 AT-SPI 遍历实测，GTK 4.20.3）：已按 §8.1 用 update_property 给 GtkPaned 容器挂 Label「查询编辑器与结果区分栏」，但该 GTK 版本的 AT-SPI 桥不暴露此名（容器 role=generic、Name 空）；容器实现 GtkAccessibleRange，暴露 CurrentValue=分隔位置（实测 239）；原生把手 role=separator、无独立名字。P1 跟进：分栏的可访问命名与键盘调节语义。",
]

