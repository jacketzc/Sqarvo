# 标签条与查询标签（编辑器 / 结果区）的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 区域边界：本区收「标签条 + 查询标签页里的编辑器与结果区」。表数据页的工具条、筛选、
# 数据网格、分页、导出归 data_page；关闭标签的确认框跟随「关闭标签」这个动作留在本区
# （README 区域边界：确认框跟随触发它的动作）。查询结果区的「导出 ▾」与状态圆点复用
# data_page / status_bar 的记录，不在这里另立一条。
#
# 行为条目取自 ui-behavior-contract.md §4（标签全文）、§5.11（查询标签的版面收敛与
# 不可用态）与 §7.1 里查询面的六行（查询标签、SQL 编辑器、结果网格、结果区五态、
# 查询游标的 Close 时机、`*` 脏标记 / 上限 8）。源码行号已按当前 tabs.rs /
# sql_page.rs / results.rs 复核，函数名仍是一级定位。

[area]
id = "tabs"
display_name = "标签条与查询标签"
summary = "工作区顶部的标签条，以及查询标签页里的动作行、编辑器与结果区：标签的新建 / 复用 / 上限 / 关闭守卫，查询的执行 / 取消、五态、结果表头与续拉。"
legacy_ref = "docs/ui-specification/ui-behavior-contract.md §4、§5.11、§7.1"

[[component]]
id = "tabs"
parent = ""
display_name = "标签条与查询标签工作区"
kind = "area"
status = "active"
style.slot = "workspace.tabstrip"
style.metrics = ["tab_strip_height"]
impl_notes = [
  "标签条在最上，下面是当前标签的内容区。`Objects` 固定页钉在最左、没有会话、不占「有会话标签」的 8 个名额。",
  "标签与内容同属一个 AdwTabView：先摘页面再释放会话（on_page_detached），避免闭包拿着已销毁的控件。",
  "标签顺序即打开顺序；拖动标签会改 AdwTabView 的顺序，标签位次按 pages() 取而不是按创建顺序。",
]

