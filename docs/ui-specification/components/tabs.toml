[[component]]
id = "tabs.query"
parent = "tabs"
display_name = "查询标签页"
kind = "container"
status = "active"
style.slot = "workspace.content"
style.metrics = ["gap_page"]
impl_notes = [
  "页内自上而下：动作行 → 编辑器（行号沟 + 等宽文本）→ 分隔线 → 结果区（五态一行 → 表头 → 行区 → 续拉）。",
  "动作行最左端是两枚下拉框：连接选择器（`tabs.query.connection_picker`）在前、库选择器（`tabs.query.database_picker`）在后；两枚都**没有可见文字**，可访问名分别是「当前连接」「当前库」。页内**没有取消按钮**：取消在状态栏行 1 的那枚两用按钮上（`status_bar.row1.ops.cancel`），与 `Esc` 是同一个方法。",
  "标签 tooltip 的「库」段写**服务端真值**（`GetSessionContext`，ADR 0030）：没有默认库时写「未指定」，不再写死「默认」。真值只随会话就绪 / 执行成功 / 切库成功刷新，刷新不改写标签请求用的 catalog。「连接」段写**实际绑定**的连接（连接选择器换过之后跟着换）。",
