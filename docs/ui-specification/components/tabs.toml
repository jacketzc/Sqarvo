  "结论行三种：查询类 / 已执行成功 → `> OK`（l10n tabs.results_msg_ok）；写语句 → `> Affected rows: N`（l10n tabs.results_msg_affected；影响行数未知时写 `> OK`，不拿 0 冒充「影响 0 行」）；失败 → `> Error: <可安全展示文案>`（l10n tabs.results_msg_error_line，文案与状态行 / tooltip 同源 `QueryFailure::message()`，可诊断但不泄露凭据与连接串，根 §9）。",
  "耗时行 `> Query Time: N.NNN seconds`（l10n tabs.results_msg_query_time；整数运算出三位小数，不经浮点）。数据源只有 `StatementSummary.elapsed_millis`（#238）：**0 = 未测量 → 整行不写**，绝不把未测量渲染成 0 秒。",
  "语句文本用完整 SQL：前端 split_statements 按分号切分实际执行的脚本（跳过字符串 / 注释里的分号），与后端 statement_index 按位置对齐；切出的条数与 statements.len() 不一致时整条退回后端 sql_preview 并在行首加「（预览）」前缀——绝不错位显示别人的 SQL。已知边界：不处理 MySQL 反斜杠转义 `\\'`（按标准 `''` 计），含此类转义的脚本会退回预览。",
  "横向策略 Never + 按词换行（WordChar）+ 等宽字体，长 SQL 在页内换行，宽度永不把窗口撑开——这就是本单存在的理由（不撑宽回归条款见 tabs.query.results.statements 的退役背景与本条 sync.linux evidence）。",
  "页面可访问名「语句日志」挂在滚动容器上（GtkScrolledWindow 的 Label 属性），内层只读 TextView 不带名字：功能用例按「只读 + multi-line + 非 editable 的 text 节点」定位。",
