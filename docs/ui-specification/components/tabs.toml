a11y.name = "保存并关闭"
impl_notes = [
  "有事务时文案写「保存、提交事务并关闭」：在事务里只提交脏行就断开，服务端会把事务回滚 —— 用户以为「保存了」，实际什么都没留下。",
  "顺序固定：先提交脏行 → 若标签有未提交事务再提交事务 → 最后才摘页面；任一步失败都保留标签并在页内说明原因。",
  "建议档（suggested），但不做默认响应（默认是取消）。",
]

[[component.interaction]]
trigger = "click"
precondition = "确认框在显示且有脏行"
result = "先提交脏行 → 再提交标签自己的事务 → 最后摘页面；提交失败时标签保留，页内提示「保存失败：事务处于「<标签>」，标签未关闭。请处理事务后再关闭。」"
source = "src/tabs.rs:2808、src/tabs.rs:2359、src/tabs.rs:2401"

