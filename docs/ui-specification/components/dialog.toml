summary = "两个风险确认框，由主菜单中的策略开关触发。"

[[component]]
id = "dialog"
parent = ""
display_name = "MCP 策略确认"
kind = "area"
status = "active"

[component.sync.linux]
state = "done"
spec_hash = "2e0ea2453e57"
evidence = "GTK QA：访问启用与关闭只读的确认框分别验证标题、档案数、取消及确认。"

[component.sync.windows]
