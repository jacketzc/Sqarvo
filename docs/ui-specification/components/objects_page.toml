[[component]]
id = "objects_page.table"
parent = "objects_page"
display_name = "三列表格（行号 · 表名 · 类型）"
kind = "container"
status = "active"
native_control = "gtk:GtkColumnView / winui:待核 / swift:—"
style.slot = "workspace.content"
style.metrics = [
  "row_height_data",
  "row_number_width",
  "column_width",
  "column_header_min_height",
  "frame_border_width",
  "radius_md",
  "font_ui",
  "font_weight_title",
]
style.tokens = ["sqarvo_frame", "sqarvo_separator"]
a11y.name = "对象列表"
a11y.tab = "可聚焦；Tab 进入后 ↑ / ↓ 移动选中"
impl_notes = [
  "GtkColumnView + GtkSingleSelection：autoselect(false)、can_unselect(true) —— 进页不自动选中首行，选中是用户的动作、也是信息面板的输入。",
  "列序固定「行号 → 表名 → 类型」，set_reorderable(false)：拖不乱；表头文本就是这三个词，单行。",
  "行号列 fixed_width 取 row_number_width 且 resizable(false)（不可拖）；表名列 expand + 可拖，初值 column_width；「类型」列 fixed_width 120 是代码常量 OBJECTS_KIND_COLUMN_WIDTH，未进 metrics.toml（P1 补齐）。",
  "行高 row_height_data，行 / 列分隔线由 GTK 画（颜色同源 @sqarvo_separator）；外框挂在 ScrolledWindow 上（.sqarvo-table-frame：frame_border_width + radius_md，overflow hidden 裁首末行底色），行与单元格不加整线。",
  "横竖滚动条常驻可见（overlay_scrolling(false)）：把「表名」拖宽后仍能滚回行号列。",
  "换密度档时只重设行号 / 表名两列宽度（reapply_tier），不重建列表、不重发请求。",
  "整个表格与数据网格逐像素同口径：行高、表头高度、悬停 / 选中底色、外框都是同一组选择器（theme.stylesheet 里 .sqarvo-grid 与 .sqarvo-objects 并列）。",
]

