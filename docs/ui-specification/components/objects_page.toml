# Objects 固定页（`objects_page`）的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 行为条目取自 ui-behavior-contract.md §3（Objects 固定页）与 §7.1（Windows 现状），
# 源码行号按当前 tabs.rs / ui.rs / startup.rs 复核；点击 / 键盘的行号一律给函数或接线行。
#
# 区域边界：固定页的「页签」记在本区（objects_page.tab），标签条本身的容器与关闭按钮
# 属于 tabs 区；本区不重复登记标签条。

[area]
id = "objects_page"
display_name = "Objects 固定页"
summary = "工作区最左侧的固定页：标题「Objects」+ 三列表格（行号 · 表名 · 类型）+ 状态行 +「加载更多…」。列表内容跟着对象树的选中换作用域，页面自己发 ListNodes 并持有自己的分页 token；不新建会话、不反写树的选中。"
legacy_ref = "ui-behavior-contract.md §3（原章节已退役为指针，行为见本文件）"

[[component]]
id = "objects_page"
parent = ""
display_name = "Objects 固定页"
kind = "area"
status = "active"
style.slot = "workspace.content"
style.metrics = ["gap_xl", "gap_md"]
impl_notes = [
  "页内自上而下只有四件东西：标题「Objects」、三列表格、状态行、「加载更多…」；标题是静态标签（13 semibold，无交互），v0.2.3.3 起页面没有作用域说明行 —— 作用域只由列表内容表达。",
  "页面没有自己的数据库会话：列表读这条连接的浏览会话（MetadataHub），与标签会话无关；关掉标签也不会动它。",
  "启动态（未连接）用同一个 ObjectsPage 实现，只换空态文案（见 objects_page.empty）。",
  "页内距 12 / 元素间距 8（gap_xl / gap_md），与数据页不同：这里没有工具条。",
]

