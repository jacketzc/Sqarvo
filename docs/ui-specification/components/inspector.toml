# 信息面板功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 行为条目取自 ui-behavior-contract.md §6 与 workspace-model.md §5，源码行号按当前
# inspector.rs / ddl.rs / column_info.rs 复核；函数名是一级定位，行号是二级定位。

[area]
id = "inspector"
display_name = "信息面板"
summary = "右侧信息面板：面板外壳与固定宽度、空态留白、连接 / 库 / 表 / 列四种视图、[DDL] 与 [表信息] 两页，以及状态页与跨标签事务提示。内容按当前标签钉住：表数据标签钉这张表、查询标签钉它选择的库（没有选择库 → 空态）、Objects 固定页跟随对象树选中；树选中、Objects 行单击与数据网格列头点击仍即时驱动预览。鼠标经过不改面板。"
legacy_ref = "ui-behavior-contract.md §6；workspace-model.md §5（原章节已退役为指针，行为见本文件）"

[[component]]
id = "inspector"
parent = ""
display_name = "信息面板"
kind = "area"
status = "active"
a11y.name = "信息面板"
style.slot = "inspector"
style.metrics = ["inspector_width", "inspector_min", "inspector_max", "inspector_gap"]
impl_notes = [
  "区域 06：工作区与面板共用一条 GtkPaned，面板是 end child，显隐由 shell.layout 控制，保留原控件与已显示内容。",
  "分隔只由 Paned 自己的分栏线提供，面板不再画 border-left；面板只留内边距（inspector_gap）。",
  "宽度默认 inspector_width，钳在 inspector_min 与 inspector_max 之间；启动态、连接态、切换连接读同一个值。",
  "宽度落盘是窗口级记忆（独立窗口状态文件），不写进 connections.json。",
  "面板内容按当前标签钉住（#196）：切到表数据标签钉该标签的表、切到查询标签钉它当前选择的库（没有选择库 → 空态）、切到 Objects 固定页跟随树当前选中；旧的「切换标签只换表页记忆（Inspector::retarget）」已删除。",
  "钉住渲染链路：tabs.rs::TabSet::pin_target 产出 TabPin → ui.rs::apply_pin 按身份键（ui.rs::pin_identity = 标签|目标）去重 → inspector.rs::show_table_pinned / render_table 渲染；Objects 页的钉住走 ui.rs::render_selection。",
  "临时预览语义保留：树选中、Objects 行单击、数据网格列头点击仍立即驱动面板，预览不改钉住键；切走再回到某标签恢复该标签钉住的内容。鼠标经过不改面板。",
  "Inspector 不缓存跨访问的元数据：每次主动选中、切换子页、重新进入或 F5 刷新都按目标重新查库；已展示数据只服务本次渲染，面板不保证与数据库实时同步。",
  "按当前展示目标的会话处理断连。所属会话断开时清理展示及在途请求，其它连接断开时保留当前展示。",
]

