# 信息面板功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 行为条目取自 ui-behavior-contract.md §6 与 workspace-model.md §5，源码行号按当前
# inspector.rs / ddl.rs / column_info.rs 复核；函数名是一级定位，行号是二级定位。

[area]
id = "inspector"
display_name = "信息面板"
summary = "右侧常驻面板：面板外壳与固定宽度、空态留白、连接 / 库 / 表 / 列四种视图、[DDL] 与 [表信息] 两页，以及状态页与跨标签事务提示。内容只由「选中」事件驱动。"
legacy_ref = "ui-behavior-contract.md §6；workspace-model.md §5（原章节已退役为指针，行为见本文件）"

[[component]]
id = "inspector"
parent = ""
display_name = "信息面板"
kind = "area"
status = "active"
style.slot = "inspector"
style.metrics = ["inspector_width", "inspector_min", "inspector_max", "inspector_gap"]
impl_notes = [
  "区域 06：工作区与面板共用一条 GtkPaned，面板是 end child，常驻显示（v0.2.3.2 起没有折叠按钮、没有 Ctrl+I，也没有 Ctrl+I 的菜单项）。",
  "分隔只由 Paned 自己的分栏线提供，面板不再画 border-left；面板只留内边距（inspector_gap）。",
  "宽度默认 inspector_width，钳在 inspector_min 与 inspector_max 之间；启动态、连接态、切换连接读同一个值。",
  "宽度落盘是窗口级记忆（独立窗口状态文件），不写进 connections.json。",
  "面板内容只由「选中」事件驱动（树、Objects 页列表、数据网格列头）；鼠标经过不改面板。",
]

[[component.interaction]]
trigger = "drag"
precondition = "面板常驻"
result = "拖动分栏线改宽度：按像素跟随，松手后写入窗口级记忆；宽度钳在 inspector_min 与 inspector_max 之间，越界就地回弹"
source = "src/shell.rs:249、src/shell.rs:230、src/window_state.rs:235"

[[component.interaction]]
trigger = "load"
precondition = "对象树的选中发生变化"
result = "按选中种类换页：连接 → 连接视图；库 / schema → 库视图；表 / 视图 / 物化视图 → 表视图；列 → 列视图；索引 / 触发器 → 状态页；序列 / 函数 / 过程 / 类型 → 只有 DDL；分组行或没有选中对象 → 空态"
source = "src/ui.rs:2101、src/inspector.rs:630"

