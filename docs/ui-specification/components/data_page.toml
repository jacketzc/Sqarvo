# 表数据页功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 迁移状态：P0 试点区。行为条目取自 ui-behavior-contract.md §5.1–§5.10
# 与 workspace-model.md §6 / §6.1，源码行号按当前 frontend/linux/src 复核，
# 函数名是一级定位（data_page.rs 的 fn 起始行）。
#
# 区域边界（别在这里重复登记的东西）：
#   * 行操作组（新增 / 删除 / 应用 / 撤销 / 刷新 / 取消）、展示形式 toggle、
#     分页器与页码摘要 —— 控件登记在 status_bar.toml（status_bar.row1.*），
#     本区只登记它们作用在数据页上的语义（见 data_page.grid / data_page.detail）。
#   * 标签条、关页守卫的确认框 —— 登记在 tabs 区。
#   * 连接断开 / 重启的对话框 —— 登记在 shell 区。

[area]
id = "data_page"
display_name = "表数据页"
summary = "表数据页（含查询标签复用同一套编辑态）：单行工具条与事务、筛选与排序面板、列显隐、数据网格与就地编辑、脏行标记与批量提交、offset 分页、导出 CSV / INSERT / 转储表、数据行右键菜单、按行浏览与单行「字段 · 值」两种展示形式，以及只读 / 空 / 错误 / 断连四态。"
legacy_ref = "ui-behavior-contract.md §5.1–§5.10；workspace-model.md §6 / §6.1（原章节已退役为指针，行为见本文件）"

[[component]]
id = "data_page"
parent = ""
display_name = "表数据页（整页）"
kind = "area"
status = "active"
style.slot = "workspace.content"
style.metrics = ["table_actions_height", "row_height_data", "grid_padding_start"]
impl_notes = [
  "自上而下：横幅 → 单行工具条 → 表头上方徽标行 → 逐行错误列表 → 表格外框（网格 / 字段 · 值）→ 占位页。",
  "页内浮层只有两块：列显隐卡片与「开始事务」卡片；筛选与排序面板是挂在漏斗按钮上的 popover（不进主窗口排版）。",
  "表格外框与 Objects 列表共用同一份 .sqarvo-table-frame（外框线宽 frame_border_width、圆角 radius_lg），圆角靠 overflow=hidden 真正裁到内容。",
  "行号列 32、表头 26、数据行 32 都只来自 metrics；页面本身不另存一份数字。",
]

[[component.interaction]]
trigger = "load"
precondition = "打开表 / 换表 / 重新读取"
result = "清空上一屏的草稿、选中、逐行错误与「最近一次操作」注记，退回按行浏览，占位页写「正在读取表数据」+「等待服务端返回第一页…」，工具条消息同步「正在读取表数据…」"
source = "src/data_page.rs:4228、src/data_page.rs:4261"

