[[component]]
id = "data_page.toolbar.commit"
parent = "data_page.toolbar"
display_name = "「提交」按钮（待提交 N 条；在途变「取消提交」）"
kind = "control"
status = "active"
a11y.name = "提交"
a11y.tab = "工具条内第一枚动作按钮"
style.slot = "workspace.content"
style.metrics = ["row_height_data"]
impl_notes = [
  "文案随待提交条数变化（提交（N），N = 脏行 + 新行草稿 + 标记删除）；在途时同一按钮变「取消提交」，取消中变「正在取消…」——文案由批次状态决定，不在视图层拼。",
  "可用性只有一个读数来源（数据页按钮的 sensitive）：状态栏「应用（✓）」直接读它，不重复判定。",
  "只读原因一旦成立，本按钮恒禁用，并把原因写进过程消息的 tooltip（不能只靠置灰暗示）。",
  "提交顺序：有新行时 `InsertRows` **先行**（整批原子，任一行失败则整批回滚），成功后才提交脏行；插入失败则一条脏行都不提交——避免库里留下半套状态。",
  "单批上限 500 行：超出时只执行前 N 条，其余留待下次，横幅「单批上限 500 行：本次只执行了前 N 条，还有 M 条未提交——请再次点「提交更改」续传。」；逐行失败的行留在草稿里，可改完再提交。",
]

[[component.interaction]]
trigger = "click"
precondition = "可编辑、有待提交变更、没有 RPC 在途"
result = "走风险判定后提交：逐行更新与删除按主键定位；按钮文案「提交（N）」，状态行「正在提交 M 条变更（批次 …）：点「取消提交」可在行边界中止」"
source = "src/data_page.rs:5086、src/data_page.rs:5147、src/submit_batch.rs:434"

[[component.interaction]]
trigger = "click"
precondition = "变更超过 100 行或含删除（本地判定）"
result = "弹「确认提交变更？」：正文给更新 / 删除行数，超过 100 行时追加「变更数超过 100 行的风险阈值…」；按钮 取消 / 确认提交（破坏性，默认取消）；取消则「已取消提交（未发送任何变更）」。服务端要求 acknowledge_risk 时再走同一个对话框"
source = "src/table_data.rs:489、src/table_data.rs:515、src/data_page.rs:5199"

[[component.interaction]]
