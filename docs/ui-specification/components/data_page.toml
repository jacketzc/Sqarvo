[[component]]
id = "data_page.toolbar.status_cluster"
parent = "data_page.toolbar"
display_name = "工具条状态簇（spinner · 过程消息 · 状态圆点）"
kind = "container"
status = "active"
a11y.name = "操作状态"
style.slot = "workspace.content"
style.metrics = ["row_height_data", "status_dot_diameter"]
impl_notes = [
  "自左向右：spinner（有 RPC 在途时可见）→ 本次操作的临时消息 → 状态圆点；整体在漏斗左侧，与图标按钮同一垂直中线。",
  "过程消息只留两类：①「正在…」进行中（正在提交… / 正在取消提交（批次 …）… / 正在读取表数据…，读取完成后擦掉）；② warning / error（权限不足、类型不可编辑、行已标记删除、提交逐行失败…）。",
  "已经发生的操作结果（第 N 行已标记删除（提交前可撤销）、已放弃未提交的更改（含新增行））不占可见文案，只写进圆点 tooltip 末段「最近一次操作：…」。",
  "这一处**不重复**行数 / 页码 / 总数：那些只在状态栏分页器显示一次。",
  "撤销（放弃未提交的更改，状态栏行操作组 ↶ / RowOp::Discard）与删除（−）的结果同样不占可见文案：前者把 ●N / ✕N / ＋ 清回普通行号，后者把行标删；两句都只写进圆点 tooltip 的「最近一次操作：…」。",
]

