parent = "object_tree"
display_name = "树本体"
kind = "container"
status = "active"
native_control = "gtk:GtkListView / winui:TreeView / swift:—"
style.slot = "sidebar"
style.metrics = ["row_height_tree", "badge_min_height"]
a11y.name = "对象树"
a11y.tab = "可聚焦；Tab 进入后 ↑ / ↓ 移动选中"
impl_notes = [
  "GtkListView + 嵌套 ListStore，每层一个 Level，层级按 source 复用（收起不作废层）。",
  "折叠后重新展开复用已读内容、不发请求。",
  "层级链固定：`My Connections`（固定标题行，不是可折叠节点）→ 连接（来自 connections.json，与是否已连接无关）→ 库 / schema → Tables / Views / Functions / Queries → 对象；表 → Fields / Indexes / Foreign Keys / Triggers；视图下直接列出列，没有分组层。",
  "树没有自定义按键控制器：除 ↑ / ↓ / Enter 与 Ctrl+F 外沿用 GTK 默认；↑ / ↓ 是 ListView + SingleSelection 的默认行为，代码不额外接线。",
]

[[component.interaction]]
trigger = "key"
keys = ["↑", "↓"]
precondition = "树有焦点"
result = "移动选中；选中变化与鼠标单击同效（信息面板与 Objects 页跟随）"
source = "src/tree.rs:1970"

[[component.interaction]]
trigger = "key"
keys = ["Enter"]
precondition = "行有焦点"
result = "等同于双击（同一回调，走 activate 信号）"
source = "src/tree.rs:2009"

