kind = "container"
status = "active"
native_control = "gtk:GtkPopoverMenu / winui:— / swift:—"
style.slot = "overlay"
impl_notes = [
  "贴着点击位置的 GtkPopover；点任一条目先收起菜单再执行动作；占位行不给菜单。",
  "收起时把 popover 的 unparent 推迟到 idle：GtkModelButton 是先 popdown（同步发 closed）再激活动作，closed 里同步摘控件树会让动作名解析不到 —— 表现就是「菜单收起、点了没反应」（#175 实测对照）。",
  "条目按行种类给、顺序固定：连接（已连接）断开连接 → 刷新连接 → 编辑连接… → 删除连接；连接（未连接 / 失败）连接（使用已保存的凭据）→ 编辑连接… → 删除连接；表 打开 → 转储表…；视图只有 打开；库 / schema 刷新库；分组 刷新这一组。",
  "没有「查看 DDL」条目：DDL 在信息面板的 [DDL] 页；视图没有「转储表」。",
]

[[component.interaction]]
trigger = "right_click"
precondition = "非占位行"
result = "右键选中此行并捕获菜单目标。点击条目时复核原连接、浏览会话及仍在原模型中的资源路径。失效时关闭菜单并提示。辅助行与无条目的行不出菜单"
