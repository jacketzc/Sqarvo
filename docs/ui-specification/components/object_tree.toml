# 对象树功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 迁移状态：P0 试点区。行为条目取自 ui-behavior-contract.md §2（对象树），
# 源码行号已按当前 tree.rs 复核，函数名仍是一级定位。

[area]
id = "object_tree"
display_name = "对象树"
summary = "左侧栏：对象树本体、搜索区、右键菜单与临时提示行。对象树是唯一的数据库对象入口，Objects 页与信息面板都跟着它的选中变化。"
legacy_ref = "ui-behavior-contract.md §2（原章节已退役为指针，行为见本文件）"

[[component]]
id = "object_tree"
parent = ""
display_name = "对象树侧栏"
kind = "area"
status = "active"
style.slot = "sidebar"
style.metrics = ["sidebar_width", "sidebar_min", "sidebar_max", "row_height_tree"]
impl_notes = [
  "侧栏只有对象树：没有页脚按钮、没有刷新按钮、没有平铺列表、没有分页统计。",
  "搜索框与搜索状态行不画在侧栏里，放在状态栏左边沟（见 object_tree.search），宽度跟随分栏线。",
]

[[component.interaction]]
trigger = "key"
keys = ["F5"]
precondition = "工作区存在，且当前标签不是表数据页（查询标签 / Objects 页 / 启动态）"
result = "整棵树（全部连接）重建：作废已连接连接的层再重读连接层，状态行写「正在重新读取对象树…」；当前标签是表数据页时 F5 刷的是那张表，不重建树"
source = "src/ui.rs:2495、src/ui.rs:2510、src/tree.rs:1453"

