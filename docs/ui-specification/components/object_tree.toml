[[component]]
id = "object_tree.tree"
parent = "object_tree"
display_name = "树本体"
kind = "container"
status = "active"
native_control = "gtk:GtkListView / winui:TreeView / swift:—"
style.slot = "sidebar"
style.metrics = ["row_height_tree", "badge_min_height"]
a11y.name = "对象树"
a11y.tab = "可聚焦；Tab 进入后 ↑ / ↓ 移动选中"
impl_notes = [
  "GtkListView + 嵌套 ListStore，每层一个 Level，层级按 source 复用（收起不作废层）。",
  "折叠后重新展开复用已读内容、不发请求。",
  "层级链固定：`My Connections`（固定标题行，不是可折叠节点）→ 连接（后端握手后由 ListProfiles 异步填充，与是否已连接无关）→ 库 / schema → Tables / Views / Functions / Queries → 对象；表 → Fields / Indexes / Foreign Keys / Triggers；视图下直接列出列，没有分组层。",
  "树没有自定义按键控制器：除 ↑ / ↓ / Enter 与 Ctrl+F 外沿用 GTK 默认；↑ / ↓ 是 ListView + SingleSelection 的默认行为，代码不额外接线。",
]

[[component.interaction]]
trigger = "key"
keys = ["↑", "↓"]
precondition = "树有焦点"
result = "移动选中和更新 Inspector 预览；只有主动 Browse 才改变 Objects 的范围。过滤、折叠、模型重建保持逻辑选择。明确失效的目标保留到重新选择或清除"
source = "src/tree.rs:1983"

[[component.interaction]]
trigger = "key"
keys = ["Enter"]
precondition = "行有焦点"
result = "等同于双击（同一回调，走 activate 信号）"
source = "src/tree.rs:2022"

[[component.interaction]]
trigger = "load"
precondition = "本地后端握手完成"
result = "异步加载共享连接档案；失败时连接树保持空并在状态栏提示档案加载失败"
source = "src/ui.rs:669"

