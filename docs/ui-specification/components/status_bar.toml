# 状态栏功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 行为条目取自 ui-behavior-contract.md §7（状态栏）与 workspace-model.md §7；
# 源码行号已按当前 shell.rs / data_page.rs / ui.rs / startup.rs 复核。
# 对象树搜索框归属 object_tree（object_tree.search / .box / .status），
# 这里只登记承载它的左边沟，不重复登记搜索框本体。

[area]
id = "status_bar"
display_name = "状态栏"
summary = "窗口底部两行：左边沟（对象树搜索区）、行 1 的行操作与分页器、行 2 的 SQL 摘要与 Last Refresh。它是同一个动作的第二个入口——可用性与读数全部来自当前标签，不在这里另存一份状态。"
legacy_ref = "ui-behavior-contract.md §7（原章节已退役为指针，行为见本文件）"

[[component]]
id = "status_bar"
parent = ""
display_name = "状态栏"
kind = "area"
status = "active"
style.metrics = ["status_height", "row_height_tree"]
style.tokens = ["sqarvo_separator", "sqarvo_status_fg", "window_fg_color"]
impl_notes = [
  "两行各 24（row_height_tree），总高 status_height = 48（v0.2.4 从 56 收到 48）；两行的高度不单独进 metrics，48 = 2 × 24 由这两个 key 共同表达。",
  "整条贴窗口底部（valign = End），上边界一条 1px 分隔线（@sqarvo_separator）：1px 描边不进 metrics。",
  "只有两种前景色：可用按钮与输入值一个色（@window_fg_color），说明文字与禁用按钮同一个灰（@sqarvo_status_fg）；状态栏里不允许出现第三档灰。",
  "行 1 与行 2 之外没有第三行：记录位置、连接名、库名、事务状态、耗时都不在状态栏（v0.2.3.3 删除），右下角也没有第二个刷新按钮。",
  "左边沟在构造时按侧栏宽度给初值，之后跟着分栏线走；搜索框垂直居中、不撑高状态栏。",
]
platform_notes.windows = "同一副骨架（`ShellView.xaml` 的 `StatusBand`）：贴底、总高 `StatusHeight`、两行各一档行高的网格；列 0 = 左边沟（宽 = 侧栏 + `GridPaddingEnd`）、列 1 = 一条 `Stretch` 到底的竖分割线、列 2 = 两行网格。行 1 左格是后端状态线、右格是六个行操作按钮 + 搜索 + 结果行数 + 只读页码；行 2 左格是 SQL 摘要或一次性提示、右格是事务状态 · 会话名 · `Last Refresh`。尺寸只走 `Metrics`、颜色只走 `ThemeResource`（底色 `SqarvoBandBrush`、竖线 `SqarvoDividerBrush`）。"

