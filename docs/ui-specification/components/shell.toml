# 窗口壳功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 迁移状态：P0 第二区。行为条目取自 ui-behavior-contract.md §1.1–§1.6（窗口、标题、主工具条、
# 菜单栏、界面密度档），源码行号已按当前 ui.rs / shell.rs / density.rs / window_size.rs 复核。
#
# 区域边界：
# - 关闭窗口守卫的确认框本体（「有未提交的更改」）不在这里登记 —— 它跟随「关闭 / 退出」这个动作，
#   但条目本身是独立表面，按 README 的边界留在触发方；这里只登记「入口被拦下」这件事。
# - 关于对话框本体归 dialogs 区；这里只登记「帮助 → 关于 Squarvo」这个入口。
# - 后端失效横幅的横幅控件画在标签页（SQL 编辑器）与数据页里，本区只登记窗口级的恢复入口：
#   「Sqarvo 需要重启」对话框与「重启 Sqarvo」。

[area]
id = "shell"
display_name = "窗口壳与主工具条"
summary = "窗口本身（最小尺寸、几何恢复、关闭守卫）、标题与副标题、主菜单、主工具条（连接 / 新建查询 / 四个种类入口）、界面密度三档，以及握手期的 Loading、握手失败错误页与后端失效后的重启入口。"
legacy_ref = "ui-behavior-contract.md §1.1–§1.6（原章节已退役为指针，行为见本文件）"

[[component]]
id = "shell"
parent = ""
display_name = "窗口外壳"
kind = "area"
status = "active"
style.metrics = ["header_height", "toolbar_height", "status_height", "min_window_width", "min_window_height"]
impl_notes = [
  "自外向内 = 标题栏（区域 01）+ 主工具条（区域 02）+ 页面槽位；工具条挂在标题栏之下、不随工作区重建。",
  "Linux 没有独立菜单行：菜单收进标题栏右侧的主菜单按钮（workspace-model 附录 A 第 2 条）；Windows 有菜单行。",
  "页面槽位轮流承载 Loading / 启动态外壳 / 工作区 / 错误页，四者互斥。",
]

[component.sync.linux]
state = "done"
spec_hash = "f398d9283e00"
evidence = "§1.1 / §1.2 外壳结构；ui.rs activate 的 header → toolbar → slot 挂载顺序"

