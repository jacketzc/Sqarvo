[[component]]
id = "shell.window"
parent = "shell"
display_name = "主窗口（最小尺寸 · 几何恢复 · 关闭守卫入口）"
kind = "container"
status = "active"
style.metrics = ["min_window_width", "min_window_height"]
a11y.name = "Sqarvo 主窗口"
impl_notes = [
  "最小尺寸由 window_size::relayout 算出后交给 set_size_request，GTK 转成 toplevel 的最小尺寸（Wayland 走 xdg_toplevel.set_min_size，X11 走 WM normal hints）。",
  "位置不恢复是平台事实：GTK4 没有读写 toplevel 位置的 API，window_x / window_y 照常写入与校验但不拿来挪窗口（blocked 的替代口径见 README「同步」一节）。",
  "关闭是一次性的：确认过一次（`close_confirmed`）后再关不二次弹窗，已进入关闭流程（`closing == true`）时的重复关闭请求直接放行，不重复跑清理。",
]

[[component.interaction]]
trigger = "load"
precondition = "窗口创建 / 每次重排"
result = "最小窗口按显示器逻辑工作区收敛：min(960·T, 工作区宽-32) × min(640·T, 工作区高-48)（T = 密度档，取值来自 metrics.toml）；`--window-size` 给更小的值时被抬到当次下限并记 `[monitor] 目标窗口 … 低于最小窗口 …`"
source = "src/window_size.rs:205、src/window_size.rs:136、src/ui.rs:171"

[[component.interaction]]
trigger = "load"
precondition = "window.json 里有记忆的尺寸 / 最大化"
result = "尺寸与最大化恢复、**位置不恢复**；记忆矩形不落在任何当前显示器几何内（±32 容差）时丢弃几何、改用分档推荐并记 `[monitor] 几何越界已丢弃：…`"
source = "src/window_size.rs:365、src/window_state.rs:209"

[[component.interaction]]
trigger = "load"
precondition = "window.json 记的几何属于旧档（记忆尺寸的档位 ≠ 当前档）"
result = "按当前档重算窗口并记 `[monitor] 档位导致窗口放大：1200x800 → 1888x1000（记忆尺寸属于 compact，当前 large）`；记忆矩形越界的校验规则不变（±32 容差内才恢复，否则丢弃改推荐尺寸）"
source = "src/window_size.rs:365、src/window_size.rs:429"

[[component.interaction]]
trigger = "click"
precondition = "点标题栏的关闭按钮"
result = "先过脏行守卫：任一个表数据标签有未提交的更改（脏行 / 标记删除 / 未提交的新增行）时**不关窗**，弹「有未提交的更改」确认框（逐表列出；本体不在这里登记），选「取消」什么都不做、「放弃更改并退出」才继续。确认过一次后再关不再二次弹窗；继续后显示「正在停止后端并清理端点文件…」，等 worker 回报 `ShutdownComplete` 才销毁窗口"
source = "src/ui.rs:414、src/ui.rs:985、src/ui.rs:972"

[[component.interaction]]
trigger = "key"
keys = ["Ctrl+Shift+W"]
precondition = "窗口存在"
result = "与标题栏关闭按钮同一条 `window.close()` → 同一个 close_request（脏行守卫照旧）"
source = "src/ui.rs:204、src/ui.rs:414"

platform_notes.windows = "位置可恢复（Linux 不可）：记忆矩形先钳到「最小窗口 ≤ 尺寸 ≤ 工作区−32 / −48」再还原，记忆点不在任何显示器工作区内（容差 32px）时丢弃几何、改用分档推荐并记 `[layout]` 日志；`maximized=true` 时先还原这个矩形再最大化，关窗写的是**还原边界**（非最大化矩形）而不是最大化后的屏幕尺寸。拖动 / 改尺寸只记账不重算（不会被拉回屏幕中央、也不会改回推荐尺寸），下限由 `OverlappedPresenter.PreferredMinimumWidth/Height`（物理像素）守住。DPI 与工作区变化合并成同一个入口：缩放取 `XamlRoot.Changed` 的 `RasterizationScale`（`DisplayInformation` 在 WinUI 3 抛异常），保留当前 DIP 矩形、不居中，`[monitor]` 的来源写「记忆 / 记忆+最大化 / 保留」（§1.6）。"

[component.sync.linux]
state = "done"
spec_hash = "5e266c21d40d"
evidence = "§1.1 最小尺寸 / 几何恢复 / 关闭窗口；window_size.rs relayout + apply，ui.rs connect_close_request"

[component.sync.windows]
state = "partial"
spec_hash = "5e266c21d40d"
note = "几何恢复含位置、最大化写还原边界、DPI / 工作区变化单入口（§1.6）；脏行守卫换成「状态栏提示 + 第二次放行」的不弹框口径（§7.1 数据页关窗守卫），与 Linux 的确认框差一条。"

