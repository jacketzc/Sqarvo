spec_hash = "4609e5ded0f3"
commit = "7436cd5"
evidence = "tests/ui/linux/results/run.TJeqNMo1/report.json：后端握手后的工作区外壳、导航空态、无绑定查询。"

[[component]]
id = "startup.loading"
parent = "startup"
display_name = "Loading 页（标题 + 握手阶段文案 + 居中 spinner）"
kind = "container"
status = "active"
style.slot = "startup"
style.metrics = ["spinner_px", "gap_xl"]
impl_notes = [
  "AdwStatusPage：标题「正在连接后端」，说明行 = 当前握手阶段文案，子控件是 spinner（居中、上方留 gap_xl）。",
  "页面只占窗口的页面槽位：Loading 期间侧栏、标签条、信息面板、状态栏都还不存在（窗口根是 headerbar + 主工具条 + 页面槽位）。",
  "窗口标题和启动状态 tooltip 归 shell 的标题组件，本区不登记；后端握手失败后的错误页同样归 shell。",
]

[[component.interaction]]
trigger = "load"
precondition = "应用启动 / 重新握手（worker 尚未回报 Connected）"
result = "页面槽位换成居中 StatusPage：标题「正在连接后端」、说明行写当前阶段文案、spinner 同时开始旋转；主工具条已挂载，依赖后端的入口在握手前禁用"
source = "src/ui.rs::show_loading"

[component.sync.linux]
state = "done"
spec_hash = "251cfd95e1c8"
commit = "7436cd5"
