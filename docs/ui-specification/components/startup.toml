[[component]]
id = "startup.loading.stage"
parent = "startup.loading"
display_name = "握手阶段文案"
kind = "control"
status = "active"
a11y.name = "握手阶段"
impl_notes = [
  "阶段文案是六条固定原文，由后端 supervisor 的握手阶段枚举给；worker 以 Event::Stage 只推枚举本身，界面在显示边界按「枚举 → l10n catalog key」映射取文案（#199，ADR 0031）：中文仍是逐字节不变的六条原文，界面不拼接；英文界面显示 startup.stage_* 的对应译文。",
  "六条原文（`l10n/startup.toml` key `startup.stage_*`）：「读取端点描述文件…」「校验协议版本与后端进程…」「启动后端进程 sqarvo-backend…」「等待后端就绪（最多 10 秒）…」「建立 gRPC 通道并附带本地会话 token…」「调用 SystemService.GetVersion 核对版本…」。",
  "说明行不总是阶段原文：show_loading 的说明还有三条调用方给的固定文案（同样进 catalog）——首帧 / 重新握手「准备连接本地后端…」（startup.desc_preparing）、重启「正在重启 Sqarvo…」（startup.desc_restarting）、关窗前「正在停止后端并清理端点文件…」（startup.desc_stopping）；标题恒为「正在连接后端」（startup.loading_title），界面只换说明行。",
]

[[component.interaction]]
trigger = "load"
precondition = "收到 Event::Stage（握手推进）"
result = "说明行改写为当前语言的阶段文案（zh = 六条原文之一，界面不拼接）；只有文本变化，不出现进度百分比、不加按钮、不改标题"
source = "src/backend/supervisor.rs:56、src/ui.rs:504、src/ui.rs:1556"

[component.sync.linux]
state = "done"
spec_hash = "464b9fe809d3"
commit = "7436cd5"
evidence = "Event::Stage 带枚举、显示边界按 `startup.stage_*` 取文案（zh 六条逐字节同迁移前）；supervisor 夹具断言照旧；cargo test 494 passed；`--lang=en --qa-layout-audit --screenshot` 960×640、1200×800 均 14 项 0 超限"

[[component]]
id = "startup.workspace"
parent = "startup"
display_name = "启动态工作区外壳（侧栏 + Objects + 信息面板 + 状态栏）"
kind = "container"
status = "active"
style.slot = "startup"
style.metrics = ["sidebar_width", "inspector_width", "status_height", "tab_strip_height"]
impl_notes = [
  "握手成功即整体替换 Loading，不再停在旧版诊断页；窗口标题为 `Sqarvo` 且副标题为空（标题归 shell 区）。",
  "侧栏是与连接态同一个对象树（同一份连接注册表）：启动态所有连接都处于「未连接」，点一下即按保存的凭据连接（行级语义见 object_tree 区）。",
  "握手完成创建一个 Workspace、TabSet 和 Shell；首次数据库连接更新同一实例。保留布局、标签顺序、活动页和草稿的未绑定状态。",
  "握手完成后可从标签行、工具条、菜单和快捷键新建草稿。",
  "主区域落地就是固定 Objects 页的空态：标题「没有选中对象」，说明「从左侧选择一个连接开始：双击一条已保存的连接即可连接。」。页面本体（页签、三列表格、状态行）与这一档文案已由 objects_page 区登记（objects_page.tab / objects_page.empty），本区保证无普通标签时显示这一页。",
  "由 TabSet 建立单个固定 Objects 页，首次连接保留这一页。",
  "信息面板是同一套外壳：未选中对象时内容区留白；选中一条已保存的连接时按 inspector 区显示连接卡片，只是没有服务端版本 / 延迟两行（未连接时省略）。",
  "启动态摘要不属于本区：状态栏把连接名「未连接」与「驱动 N · 浏览会话 M」拼成一行「未连接 · 驱动 0 · 浏览会话 0」，登记在 status_bar 区（status_bar.row2.session）；本区只把 N / M 的真实取值（驱动数照抄握手快照、浏览会话数为 0）交给它。",
  "启动态没有表标签：中央操作行的行操作全部禁用并给原因「未连接：从左侧选择一个连接开始」，SQL 摘要写「尚未连接」——行 1 的结构与原因文案归 status_bar 区。",
]

[[component.interaction]]
trigger = "load"
precondition = "握手成功（Event::Connected）"
result = "外壳落地：侧栏换成对象树（已保存连接全部「未连接」）、主区域放固定 Objects 页、信息面板按布局状态显隐，未选中对象时内容区留白、状态栏写「未连接」；连上数据库前不存在表标签"
source = "src/ui.rs::show_startup_workspace"

[[component.interaction]]
