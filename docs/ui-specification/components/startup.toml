  "阶段文案是六条固定原文，由后端 supervisor 的握手阶段枚举给（worker 以 Event::Stage 逐条推给界面），界面不拼接、不翻译。",
  "六条原文：「读取端点描述文件…」「校验协议版本与后端进程…」「启动后端进程 sqarvo-backend…」「等待后端就绪（最多 10 秒）…」「建立 gRPC 通道并附带本地会话 token…」「调用 SystemService.GetVersion 核对版本…」。",
  "说明行不总是阶段原文：show_loading 的说明是调用方给的字符串——首帧 / 重新握手「准备连接本地后端…」（ui.rs:275、ui.rs:380）、重启「正在重启 Sqarvo…」（ui.rs:1318）、关窗前「正在停止后端并清理端点文件…」（ui.rs:407）；标题恒为「正在连接后端」，界面只换说明行。",
]

