# 启动态外壳功能区的组件注册表（唯一真值）。
#
# 规范与用法：components/README.md；决策：ADR 0027。
# 数字只引用 metrics.toml 的 key，颜色只引用主题 token —— 这里不许出现 px 与 #RRGGBB。
# spec_hash 由 scripts/check-ui-sync.sh mark 生成，不要手填。
#
# 区域边界：只收「握手期间」与「握手成功但还没连上任何数据库」这两档表面。
# - 侧栏对象树、Objects 页三列表格、信息面板、状态栏两行结构、主工具条都是连接态
#   已有的组件，归各自功能区（object_tree / objects_page / inspector / status_bar / shell）；
#   本区只登记启动态这一档的摆放、空态文案与摘要文案来源。
# - 后端握手失败的错误页、握手期间的窗口标题（标题栏副标题改「正在连接…」）归 shell。
#
# 迁移状态：P0。行为条目取自 ui-behavior-contract.md §1.1（应用启动）、§3（启动态空态）、
# §7（启动态状态栏摘要）与 workspace-model.md §4 / §5 的启动态段落；源码行号按当前
# startup.rs / ui.rs / shell.rs / tree.rs 复核。

[area]
id = "startup"
display_name = "启动态外壳"
summary = "握手期间的 Loading 页，以及握手成功后、还没有连接数据库时的六区域外壳：侧栏是与连接态同一个对象树（全部「未连接」）、主区域是固定 Objects 页的空态、信息面板常驻留白、状态栏写「未连接」。这里登记的是「启动态」这一档表面，不重复登记表结构。"
legacy_ref = "ui-behavior-contract.md §1.1、§3、§7（原章节已退役为指针，行为见本文件）"

[[component]]
id = "startup"
parent = ""
display_name = "启动态外壳"
kind = "area"
status = "active"
style.slot = "startup"
style.metrics = ["sidebar_width", "inspector_width", "status_height"]
impl_notes = [
  "启动态不是独立一套界面：握手成功后 ui.rs 用 StartupWorkspace 组装六个区域，侧栏 / 标签条 / 信息面板与连接态是同一套实现，连上数据库后由 Workspace 整体替换。",
  "后端诊断信息（版本 / 协议 / PID / 端点文件）不在启动态出现，在「帮助 → 关于 Squarvo」里。",
  "启动顺序（窗口级，全在 ui.rs::activate）：建窗口并把 headerbar（ui.rs:177-199）、主工具条与页面槽位（ui.rs:270-271）挂进根容器 → toolbar.set_backend_ready(false)（ui.rs:274，随即打一行 0/6）→ show_loading「准备连接本地后端…」（ui.rs:275）→ WorkerHandle::spawn（ui.rs:277）→ 每个 Event::Stage 改写说明行（ui.rs:504-506）→ Event::Connected 置就绪、标题回 Sqarvo /「未连接」、show_startup_workspace（ui.rs:538-548）。页面槽位里 Loading 与启动态外壳互斥，任一时刻只有一个。",
]

[component.sync.linux]
state = "done"
spec_hash = "4609e5ded0f3"
