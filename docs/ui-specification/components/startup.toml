[[component]]
id = "startup.loading.spinner"
parent = "startup.loading"
display_name = "加载 spinner"
kind = "control"
status = "active"
a11y.name = "正在连接后端"
style.metrics = ["spinner_px"]
impl_notes = [
  "GtkSpinner：边长取 spinner_px（请求值，由 GTK 决定实际绘制），构造后立即 start()。",
  "阶段推进走同一个 show_loading：set_page 先清空页面槽位再挂新的 StatusPage 与 spinner（ui.rs:1532-1554），上一帧的动画状态不保留；两帧之间只差一行说明，视觉上仍是同一处居中 spinner、没有静止帧。",
]

[[component.interaction]]
trigger = "load"
precondition = "Loading 页出现"
result = "立即开始旋转（无静止帧）；阶段推进只换说明行，spinner 一直在转（整页替换时不出现静止帧、不闪）"
source = "src/ui.rs:1558、src/ui.rs:1561"

[component.sync.linux]
state = "done"
