# Sqarvo 布局度量真值（单一口径）
#
# 这是三端（Linux GTK / Windows WinUI 3 / macOS SwiftUI）共享的**唯一**尺寸来源。
# 规范文字见 scaling-and-window-sizing.md；本文件只放数字，数字改动必须与本文件同 PR。
#
# 为什么三档都写死整数、而不是「基准 × 缩放系数」：
#   Rust 的 f64::round 是 half-away-from-zero，C# 的 Math.Round 默认是 half-to-even，
#   Swift 的 rounded() 又是 half-away-from-zero。同一份 26×1.25 在两个语言里会得到 33 和 32，
#   三端就会静默漂移。所有档位的取值在这里全量列出，各端只读、不计算。
#
# 颜色不在这里：颜色一律走主题 token（Linux 的 @define-color / WinUI 的 ThemeResource），
# 任何界面 CSS / XAML 里出现 #RRGGBB 都算缺陷。
#
# 不随档位缩放的量（刻意排除）：
#   border_width_px = 1        1px 描边在所有档位都保持 1px（1.5× 的 1.5px 细线会发糊）
#   icon_stroke_px  = 1.6      符号图标描边来自图标网格，不随密度档变
#   frame_border_width = 2     表格外框线宽同理：三档同值（每档里也照写一遍，便于各端直接读）
#   pill_radius = 99           饱和圆角（半个盒子），三档同值
#
# 收录范围（2026-11-11 补齐）：除了六个区域的高度 / 宽度 / 字号 / 行高，还包含
#   1. 间距阶梯 gap_none / gap_xxs / gap_xs / gap_sm / gap_md / gap_lg / gap_xl /
#      gap_xxl / gap_page —— 界面里的 margin 与 Box spacing 只从这九档取；
#   2. CSS 专用度量 radius_lg / pager_button_min_width / fs_button_min_height /
#      fs_action_min_height / empty_icon_px / spinner_px / column_panel_width /
#      column_list_max_height（列显隐弹层）。
#   这两组以前在代码里按「基准 × 倍率」算，现已全部展开成三档整数：任何一端都不许
#   再自己乘一遍（取整规则不同会漂 1px）。

version = 1

[meta]
layout_reference_window = [1200, 800]   # 规范参考窗口（原型 / 截图基线），不是默认窗口
default_tier = "compact"
available_tiers = ["compact", "comfortable", "large"]
border_width_px_never_scaled = 1

[tier.compact]
id = "compact"
label = "紧凑（100%）"
scale = 1.0
header_height = 64   # 64 × 1.0 = 64
toolbar_height = 44   # 44 × 1.0 = 44
status_height = 48   # 48 × 1.0 = 48
min_window_width = 960   # 960 × 1.0 = 960
min_window_height = 640   # 640 × 1.0 = 640
sidebar_width = 237   # 237 × 1.0 = 237
sidebar_min = 180   # 180 × 1.0 = 180
sidebar_max = 420   # 420 × 1.0 = 420
inspector_width = 280   # 280 × 1.0 = 280
inspector_min = 240   # 240 × 1.0 = 240
inspector_max = 520   # 520 × 1.0 = 520
tab_strip_height = 24   # 24 × 1.0 = 24
table_actions_height = 46   # 46 × 1.0 = 46
grid_padding_start = 18   # 18 × 1.0 = 18
grid_padding_end = 3   # 3 × 1.0 = 3
inspector_gap = 10   # 10 × 1.0 = 10
row_height_tree = 24   # 24 × 1.0 = 24
row_height_data = 32   # 32 × 1.0 = 32
column_header_min_height = 26   # 26 × 1.0 = 26
font_ui = 12   # 12 × 1.0 = 12
font_title = 13   # 13 × 1.0 = 13
font_status = 11   # 11 × 1.0 = 11
font_data_cell = 13   # 13 × 1.0 = 13
font_panel = 10   # 10 × 1.0 = 10
# ---- 字重（不随密度缩放：三端只有这四档语义，档位之间不插值） ----
font_weight_ui = 400   # 正文 / 按钮 / 说明字
font_weight_cell = 500   # 数据单元格（13px Regular 在 1x 屏横画发虚，提一档到 Medium）
font_weight_title = 600   # 窗口标题 / 列头 / 页内标题 / 筛选面板标题
font_weight_heading = 700   # 卡片 · 面板 · 对象树连接与分组名（原来由 Adwaita .heading 提供）
min_target = 24   # 24 × 1.0 = 24
icon_box = 16   # 16 × 1.0 = 16
icon_button_width = 28   # 28 × 1.0 = 28
icon_button_height = 24   # 24 × 1.0 = 24
status_dot_diameter = 7   # 7 × 1.0 = 7
toolbar_padding_h = 12   # 12 × 1.0 = 12
objects_min_width = 84   # 84 × 1.0 = 84
pager_font = 12   # 12 × 1.0 = 12
badge_min_height = 26   # 26 × 1.0 = 26
secondary_min_height = 22   # 22 × 1.0 = 22
radius_sm = 6   # 6 × 1.0 = 6
radius_md = 8   # 8 × 1.0 = 8
tree_arrow_box = 18   # 18 × 1.0 = 18
row_number_width = 32   # 32 × 1.0 = 32
column_width = 200   # 200 × 1.0 = 200
column_resize_hit = 4   # 列边界拖宽把手的命中热区（DIP）：4 × 1.0 = 4
column_min_width = 64   # 列宽下限（DIP）：64 × 1.0 = 64
column_cell_padding = 8   # 双击自适应时为单元格文字预留的左右内距（DIP，各一份）：8 × 1.0 = 8
filter_panel_width = 430   # 430 × 1.0 = 430
filter_column_width = 140   # 140 × 1.0 = 140
column_panel_width = 300   # 300 × 1.0 = 300（列显隐弹层内容宽）
column_list_max_height = 260   # 260 × 1.0 = 260（列显隐清单最大高度）
# ---- 间距阶梯（`layout::Gap` 门面按这里取值；代码里不再算「基准 × 倍率」） ----
gap_none = 0   # 0 × 1.0 = 0
gap_xxs = 2   # 2 × 1.0 = 2
gap_xs = 4   # 4 × 1.0 = 4
gap_sm = 6   # 6 × 1.0 = 6
gap_md = 8   # 8 × 1.0 = 8
gap_lg = 10   # 10 × 1.0 = 10
gap_xl = 12   # 12 × 1.0 = 12
gap_xxl = 14   # 14 × 1.0 = 14
gap_page = 18   # 18 × 1.0 = 18

# ---- CSS 专用度量（圆角 / 线宽 / 分页与筛选按钮 / 空态与加载） ----
frame_border_width = 2   # 表格外框线宽：三档都是 2px（描边不随密度变）
radius_lg = 12   # 12 × 1.0 = 12（列信息 / 事务卡片浮层）
pill_radius = 99   # 饱和圆角：状态圆点等，三档同值
pager_button_min_width = 26   # 26 × 1.0 = 26
fs_button_min_height = 26   # 26 × 1.0 = 26（筛选面板的条件行按钮）
fs_action_min_height = 28   # 28 × 1.0 = 28（筛选面板「应用」按钮）
empty_icon_px = 48   # 48 × 1.0 = 48（空态占位图标）
spinner_px = 32   # 32 × 1.0 = 32（加载 spinner 请求边长）

