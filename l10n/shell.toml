# 外壳区文案目录（注册表区 `shell.*`，ADR 0031 决策 2）。
#
# schema 见同目录 `README.md`。`zh` 是 source of truth：除「视图 → 语言」小节
# （S1 新增条目）外，每条 `zh` 与被替换的代码内原字面量逐字节相等。
#
# 本区覆盖：headerbar 主菜单按钮 tooltip、「文件 / 视图 / MCP / 帮助」全部条目与三级
# 小节（深色模式 / 界面密度 / 语言）、「帮助 → 关于」入口、主工具条六个按钮与
# 全部 tooltip、换语言重启确认框；窗口标题栏副标题族全部状态字（`shell.title_*`：
# 正在连接 / 正在重启 / 连接失败 / 已断开 / 未连接 / 已连接模板 / 正在切换连接，
# 含 tabs 经 `on_title` 回写到窗口的两条）与握手失败 / 已断开两个 Error 页表面
# （`shell.error_*`：页面标题与重试 / 重新连接按钮）。标签条 / 状态栏 / 启动加载
# 界面的文案各归 `tabs.toml` / `status_bar.toml` / `startup.toml`；对象树、
# 对话框、数据页、查询页、信息面板与 Objects 页随 #200–#203 迁移。
#
# 条目 key 与 ui.rs / shell.rs 的接线一一对应；改动这里即改动界面文案（构建期
# 生成，生成失败 = 构建失败，决策 3）。

