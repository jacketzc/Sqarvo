# Objects 固定页文案目录（注册表区 `objects_page.*`，ADR 0031 决策 2；迁移切片 S3/#201 Lane B）。
#
# schema 见同目录 `README.md`；每条 `zh` 与被替换的代码内原字面量逐字节相等
# （位置参数改名为命名占位的条目在 Issue #201 汇报的白名单里逐条列出）。
# 覆盖表面：`Objects` 固定页（tabs.rs::ObjectsPage）的三列表头、空态、状态行、
# 「加载更多…」与行 tooltip；Functions / Queries 的「尚未实现」说明页（unavailable_copy，
# 树分组与工具条入口共用同一份）；启动态 Objects 空态两行（startup.rs 判归本页）。
# 不在这里登记：页内标题「Objects」与条目名「Functions / Queries」（本就是英文）、
# 行号格 tooltip「第 N 行」（与数据页行号同一口径，#202）、日志行、QA 钩子错误串。

