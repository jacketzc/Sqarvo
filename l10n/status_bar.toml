# 状态栏区文案目录（注册表区 `status_bar.*`，ADR 0031 决策 2）。
#
# schema 见同目录 `README.md`；每条 `zh` 与被替换的代码内原字面量
# 逐字节相等。本区覆盖状态栏两行的全部界面文字：行操作与分页器的
# tooltip、页码与选中数、SQL 摘要与最后刷新、启动态「未连接」摘要。
# 「N selected」「SQL:」「Last Refresh:」这类既有英文口径保持原样，
# 不进 catalog（terms.md 规则 3）；数据页快照的 total_text 等由
# #202 迁移。

[[entry]]
key = "status_bar.pager_note"
zh = "offset 分页（#118）：首页 / 上页 / 下页 / 末页；页码只读，跳转到远处页码不在本版提供"
en = "Offset paging: first / previous / next / last; the page number is read-only, and jumping to distant pages is not offered in this version"
status = "done"

[[entry]]
key = "status_bar.op_add_tip"
