# -- 导出向导（export_ui.rs：种类 → 范围 → 文件选择 → 口径确认 → 覆盖确认 → 进度 → 完成；#203 S5 Lane B）--
#
# 「取消」复用 S2 的 `dialogs.btn_cancel`；「复制路径」/「已复制」复用日志窗口的
# `dialogs.logs_copy_btn` / `dialogs.logs_copied_tooltip`（逐字同句）。默认文件名
# `sqarvo-export.csv` / `sqarvo-insert.sql` 与文件末尾注释标记 `# sqarvo:` /
# `-- sqarvo:` 是**数据**（写进文件本体），不进目录；`ExportKind::label` 的 `CSV`
# 语言无关留代码。计数句登记 en_one（行 / 单元格两数词），`t_n` 只在英文换形态。

