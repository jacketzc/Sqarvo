# 对话框区文案目录（注册表区 `dialogs.*`，ADR 0031 决策 2；迁移切片 S2/#200）。
#
# schema 见同目录 `README.md`；每条 `zh` 与被替换的代码内原字面量逐字节相等
# （位置参数改名为命名占位的条目在 Issue #200 汇报的白名单里逐条列出）。
# 覆盖表面：连接对话框表单与状态行（dialog.rs / driver_form.rs 校验）、连接配置
# 读写错误（config.rs）、关窗守卫（ui.rs + tabs.rs close_guard_body）、通用提示
# 框（ui.rs show_message）、保存凭据提示（ui.rs）、关于 Squarvo（ui.rs）、
# 日志窗口（logs.rs）。关标签确认框与超限提示按区归 tabs.toml，握手进行中说明行
# 按 startup.* 归 startup.toml；删除 / 断开连接确认与后端重启确认按注册表归属
# object_tree / shell 区（#201 / S1 范围），不在这里重复登记。

