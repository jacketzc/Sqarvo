[[entry]]
key = "dialogs.export_range_body"
zh = "选择导出范围（{kind}）：\n\n当前页：只写这一页已加载的 {page_rows} 行（写的是页面上当前的值，含未提交编辑）。\n\n整张表：按当前标签的排序与筛选逐页读取，边读边写同一个文件。\n· 不设行数上限，读多少写多少；\n· 进度可见，随时可以取消；\n· 取消或失败不会留下半截文件，目标路径不会出现新文件；\n· 读的是数据库里已提交的值，本页未提交的编辑不在文件中。"
en = "Choose the export range ({kind}):\n\nCurrent page: writes only the {page_rows} loaded rows on this page (the values currently shown on the page, including uncommitted edits).\n\nEntire table: reads page by page with this tab's sort and filter, writing to the same file as it reads.\n· No row limit; it writes whatever it reads;\n· progress is visible, and it can be cancelled at any time;\n· cancelling or failing leaves no half-written file; no new file appears at the target;\n· it reads committed values from the database; uncommitted edits on this page are not in the file."
en_one = "Choose the export range ({kind}):\n\nCurrent page: writes only the 1 loaded row on this page (the value currently shown on the page, including uncommitted edits).\n\nEntire table: reads page by page with this tab's sort and filter, writing to the same file as it reads.\n· No row limit; it writes whatever it reads;\n· progress is visible, and it can be cancelled at any time;\n· cancelling or failing leaves no half-written file; no new file appears at the target;\n· it reads committed values from the database; uncommitted edits on this page are not in the file."
status = "done"

