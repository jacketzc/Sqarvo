# -- 口径确认对话框（confirm：标题 / 写出口径正文 / 注入防护开关） -----------------------------

[[entry]]
key = "dialogs.export_whole_table_note"
zh = "\n\n整表导出按当前排序与筛选逐页读取，边读边写同一个文件：\n· 不设行数上限；\n· 有进度、可随时取消；\n· 取消或失败会删除临时文件，目标路径不会出现半截文件。"
en = "\n\nThe whole-table export reads page by page with the current sort and filter, writing to the same file as it reads:\n· no row limit;\n· progress, and it can be cancelled at any time;\n· cancelling or failing deletes the temporary file; no half-written file appears at the target."
status = "done"

[[entry]]
key = "dialogs.export_csv_scope"
zh = "\n\n写出口径：空字段 = SQL NULL；空字符串写为 \"\"。二进制写占位 (BLOB n bytes)，不导出原始字节；Decimal 保留原文，日期时间用 ISO 8601。"
en = "\n\nExport rules: an empty field = SQL NULL; the empty string is written as \"\". Binary values become the placeholder (BLOB n bytes); raw bytes are not exported; Decimal keeps its original text; dates and times use ISO 8601."
status = "done"

[[entry]]
key = "dialogs.export_dump_content"
zh = "\n\n文件内容：先是建表语句，之后每行一条 INSERT INTO … VALUES (…);\n数据是数据库里已提交的全部行；BLOB 写成 NULL（文件末尾注明数量），被服务端截断的文本只有前缀。"
en = "\n\nFile contents: the CREATE TABLE statement first, then one INSERT INTO … VALUES (…) per line;\nthe data is every committed row in the database; BLOBs are written as NULL (counts noted at the file's end), and server-truncated text contains only its prefix."
status = "done"

[[entry]]
key = "dialogs.export_insert_scope"
zh = "\n\n写出口径：每行一条 INSERT INTO … VALUES (…);\nNULL 写 NULL、空串写 ''；BLOB 写成 NULL（文件末尾注明数量）；Decimal 用原文，日期时间用 ISO 8601。"
en = "\n\nExport rules: one INSERT INTO … VALUES (…) per line;\nNULL is written as NULL, the empty string as ''; BLOBs become NULL (counts noted at the file's end); Decimal keeps its original text, dates and times use ISO 8601."
status = "done"

[[entry]]
key = "dialogs.export_truncated_warning"
zh = "\n\n警告：有 {truncated_cells} 个单元格被服务端截断，文件里只有前缀。"
en = "\n\nWarning: {truncated_cells} cells were truncated by the server; the file holds only prefixes."
en_one = "\n\nWarning: 1 cell was truncated by the server; the file holds only its prefix."
status = "done"

