[[entry]]
key = "workspace.mcp.prompt"
zh = "请在当前本地 MCP 客户端中配置名为 sqarvo 的 Streamable HTTP 服务。地址：{url}。当前状态：{state}。认证：Bearer，需由用户安全提供。识别客户端的配置方式，只添加或更新 sqarvo，并保留其他服务器。Codex 使用 bearer_token_env_var 引用 SQARVO_MCP_HTTP_TOKEN，请用户从终端运行 sqarvo-mcp http-auth launch codex --port {port}。其他客户端优先使用其安全凭据引用，无法安全引用时请用户手动选择 stdio。服务运行后验证连接及 tools/list，报告结果和重启要求。请勿在聊天索要、输出或保存令牌。请勿修改连接档案、数据库、MCP 数据访问或只读策略，或运行与客户端配置无关的操作。"
en = "Configure the local Streamable HTTP MCP server named sqarvo in this client. URL: {url}. Current state: {state}. Authentication: user-supplied Bearer credential. Detect the client configuration format and add or update only sqarvo. For Codex reference SQARVO_MCP_HTTP_TOKEN using bearer_token_env_var and ask the user to run sqarvo-mcp http-auth launch codex --port {port} in a terminal. Use a secure credential reference for other clients or ask the user to select stdio. Once the server is running, verify the connection and tools/list and report whether a restart is needed. Keep credentials out of chat, files, and logs. Do not change connection profiles, databases, MCP permissions or read-only policy, or run actions unrelated to client setup."
status = "done"

[[entry]]
key = "workspace.mcp.stdio"
zh = "请在当前本地 MCP 客户端中配置名为 sqarvo 的 stdio 服务。可执行文件：{command}。无参数。由客户端启动，不使用 HTTP 令牌。仅编辑 sqarvo 的客户端配置，验证 tools/list，报告结果与是否需重启。请勿更改数据库、档案或 MCP 授权策略。"
en = "Configure a local stdio MCP server named sqarvo. Executable: {command}. Use no arguments. The client starts the server with no HTTP credential. Edit only the sqarvo client entry, verify tools/list, and report the result and restart requirements. Keep databases, profiles and MCP permissions unchanged."
status = "done"

