[[entry]]
key = "tabs.close_title"
zh = "关闭标签？"
en = "Close Tab?"
status = "done"

[[entry]]
key = "tabs.close_body_dirty"
zh = "该标签有 {dirty} 行未提交的更改。关闭会丢失这些更改：可以选择先保存，或直接放弃。"
en = "This tab has {dirty} rows of uncommitted changes. Closing the tab would lose them: save first, or discard."
en_one = "This tab has {dirty} row of uncommitted changes. Closing the tab would lose it: save first, or discard."
status = "done"

[[entry]]
key = "tabs.close_body_transaction"
