# ==== S5 Lane A：查询页与结果区（#203 前段，ADR 0031 S5） ====
#
# 覆盖表面：sql_page.rs 的执行按钮与工具条、库 / 连接选择器 tooltip 与可访问名、
# 单表编辑入口提示、执行 / 取消 / 断连状态措辞、关闭结果区丢弃确认框；
# results.rs 的结果区五态状态行、总数与保留行计数、续拉 / 触顶提示、占位页标题与
# 说明、状态圆点空态 tooltip；statements.rs 的语句切换行条目与 tooltip。
# 逐字相同的句子不在这里重复建：「重启 Sqarvo」= shell.recovery_btn_restart、
# 「导出 CSV… / 导出为 INSERT 语句…」= data_page.export_menu_*、「取消」=
# tabs.close_btn_cancel、「已放弃未提交的更改」= data_page.discard_all、
# 「已断开」= data_page.txn_disconnected_label、「无结果集」= tabs.query_no_result_set、
# 「编辑 {column_name} · {type_label}」= data_page.editor_title、「共 N 行」=
# object_tree.total_exact、圆点脏行计数 = data_page.dirty_plain / txn_autocommit /
# dot_note_autocommit。
# 不迁入本区：日志行（eprintln!）、qa.rs 与 QA 内部报错、后端直出文案
# （QueryFailure::message/detail、sanitize、超时句 —— S8/#206）、export_ui.rs（Lane B）。


