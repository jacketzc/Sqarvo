# 数据网格区文案目录（注册表区 `data_page.*`，ADR 0031 决策 2；迁移切片 S4/#202 Lane A + Lane B + Lane C）。
#
# schema 见同目录 `README.md`；每条 `zh` 与被替换的代码内原字面量逐字节相等
# （位置参数改名为命名占位的条目在 Issue #202 汇报的白名单里逐条列出）。
# Lane A 覆盖表面：数据网格（data_page.rs）的表工具条（列显隐 / 筛选与排序 / 导出
# 按钮与导出菜单条目与范围提示）、列显隐浮层、筛选与排序面板（含条件/排序键行内编辑
# 与校验错误）、六类常驻徽标（只读 / 无主键 / 视图 / 无权限 / 未统计 / 驱动不支持排序
# 筛选）及 tooltip 全文、网格状态行（正在读取 / 空表 / 越界空页 / 已断开 · 已加载 N
# 行）、分页器动作名与翻页消息、行号格（行号表头与脏/删除/新行图例 tooltip）、单元格
# 截断与脏标记 tooltip、「字段 / 值」视图表头与切换提示、复制为 INSERT 的选择提示；
# tabs.rs Objects 页行号格 tooltip「第 N 行」（与数据页行号同一口径，S3 移交本切片）。
# Lane B 覆盖表面（编辑器与提交面）：单元格编辑器与新增行编辑器（open_cell_editor /
# open_insert_editor 的标题、NULL 勾选、可空/不可空提示、省略列态、应用/取消、值转换
# 失败就地报错）、detail_cell_factory 编辑提示、编辑受限原因（edit_block_reason）、
# 新增行草稿（begin_insert / submit_insert / show_inserted / committed_insert_cells 与
# table_data.rs 的 InsertDraft）、table_data.rs 用户可见面（ReadOnlyCause 的 headline /
# explanation / banner、parse_cell_input 各族值校验错误、列/行下标越界、影响行数与期望
# 不符、提交批次摘要与风险确认文案、事务四态徽标与开始/提交/回滚原因、隔离级别卡片），
# 提交面按钮与脏行计数标签（update_dirty_label 的 one/other 两态）、标记删除与
# delete_note、放弃更改、事务三按钮与隔离级别卡片、begin_tooltip、sync_status_dot 事务
# 说明、show_failures 失败摘要、数据行右键菜单条目（删除行 / 复制为 INSERT / 复制为 ▸）、
# result_edit.rs（新增行草稿态三条）、submit_batch.rs（批次状态、失败摘要、重放/取消）、
# tabs.rs 关窗守卫消费的 DirtyTabSummary::line 逐表摘要模板。
# 跨区复用：数据页「Sqarvo 需要重启」横幅按钮取既有 shell.recovery_btn_restart，不新建
# 重复条目（见 Issue #202 汇报）。
# Lane C 覆盖表面（状态页副文本收口）：DDL 面板（ddl.rs）的读取中 / 无浏览会话 /
# 空 DDL 状态页标题与副文本、拼装警示行（{detail} 命名占位）；MetadataError 的
# headline()/hint() 全族 20 条（#201 遗留——同一句副文本同时进对象树状态行、信息面板
# 与 DDL 状态页）；backend/table.rs 的 type_not_editable_reason（列类型不支持行内编辑）。
# 不在这里登记：日志行（eprintln!）、QA 钩子错误串（qa_* 助手）、backend/query.rs 的值
# 格式化 tooltip（与查询结果网格共用，随 #203 一起收）、results.rs / statements.rs /
# export*（#203）、结构连接符与分隔符（列头「列名 · 类型」、parts.join(" · ")、
# 「{txn} · {dirty}\n{note}」骨架、错误副文本骨架「{message}（{code}）。{hint}」）、
# DDL 空 DDL 之外仅进日志的 worker 串、backend/metadata.rs 与 backend/table.rs
# sanitize 的「（后端未提供错误消息）」、TableFailure::detail()/message() 直出的
# 后端 message、backend/table.rs 的取消批内嵌语（「本批未及执行任何变更」「已执行
# N 条变更随后整批回滚」）与提交/插入摘要的其余分支（#77/#88 逐字钉的测试原文，
# S8 收口）、failures() 的「服务端未提供原因」与超时消息（S8 detail 直出族）、
# qa.rs TxnExpectation 硬编码中文标签（S7 钩子适配项）。

