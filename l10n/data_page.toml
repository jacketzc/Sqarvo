# 数据网格区文案目录（注册表区 `data_page.*`，ADR 0031 决策 2；迁移切片 S4/#202 Lane A）。
#
# schema 见同目录 `README.md`；每条 `zh` 与被替换的代码内原字面量逐字节相等
# （位置参数改名为命名占位的条目在 Issue #202 汇报的白名单里逐条列出）。
# 覆盖表面：数据网格（data_page.rs）的表工具条（列显隐 / 筛选与排序 / 导出按钮与
# 导出菜单条目与范围提示）、列显隐浮层、筛选与排序面板（含条件/排序键行内编辑与
# 校验错误）、六类常驻徽标（只读 / 无主键 / 视图 / 无权限 / 未统计 / 驱动不支持
# 排序筛选）及 tooltip 全文、网格状态行（正在读取 / 空表 / 越界空页 / 已断开 ·
# 已加载 N 行）、分页器动作名与翻页消息、行号格（行号表头与脏/删除/新行图例
# tooltip）、单元格截断与脏标记 tooltip、「字段 / 值」视图表头与切换提示、
# 复制为 INSERT 的选择提示；tabs.rs Objects 页行号格 tooltip「第 N 行」
# （与数据页行号同一口径，S3 移交本切片）。
# 不在这里登记：日志行（eprintln!）、QA 钩子错误串（qa_* 助手）、单元格编辑器与
# 提交面（open_cell_editor / open_insert_editor / 提交 / 事务 / 放弃 / 脏行摘要，
# Lane B）、`ddl.rs` 与 MetadataError（Lane C）、`results.rs` / `statements.rs` /
# `export*`（#203）、`backend/query.rs` 的值格式化层（与查询结果网格共用，判定见
# Issue #202 汇报）、`ReadOnlyCause` 横幅（table_data.rs，编辑受限判定面）。

