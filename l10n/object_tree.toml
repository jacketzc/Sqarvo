# 对象树区文案目录（注册表区 `object_tree.*`，ADR 0031 决策 2；迁移切片 S3/#201）。
#
# schema 见同目录 `README.md`；每条 `zh` 与被替换的代码内原字面量逐字节相等
# （位置参数改名为命名占位的条目在 Issue #201 汇报的白名单里逐条列出）。
# 覆盖表面：对象树侧栏（tree.rs）的占位行 / 分组说明 / 行 tooltip / 右键菜单 /
# 状态行 / 搜索状态与结果计数；浏览会话与连接注册表（browse.rs）的树行状态副标
# 与失败原因；浏览视图的筛选与分页文案（browse_view.rs）；对象树侧的三个确认框
# （断开 / 删除 / 编辑连接，ui.rs 正文与按钮）。
# 不在这里登记：日志行（eprintln!）、QA 钩子的错误串（qa.rs 与树内 qa_* 助手）、
# Objects 页与信息面板（Lane B）、数据页 / 查询页（#202 / #203）。

