# 信息面板区文案目录（注册表区 `inspector.*`，ADR 0031 决策 2；迁移切片 S3/#201 Lane B）。
#
# schema 见同目录 `README.md`；每条 `zh` 与被替换的代码内原字面量逐字节相等
# （位置参数改名为命名占位的条目在 Issue #201 汇报的白名单里逐条列出）。
# 覆盖表面：信息面板头部与空态（inspector.rs）、连接 / 库 / 表 / 列四种视图的
# 字段名与值说明、`[DDL] / [表信息]` 切换与 tooltip、状态页文案、跨标签事务提示
# （ui.rs 调用点）；列信息文案层（column_info.rs，前缀 `inspector.column_*`）。
# 不在这里登记：日志行（eprintln!）、layout_audit 目标名、`TablePage::parse`
# 接受的取值、`ddl.rs` 面板文案（判定留码，见 Issue #201 汇报）、数据页 / 查询页。

